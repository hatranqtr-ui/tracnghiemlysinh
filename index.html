 dịch phải đục và ánh sáng chiếu vào phải đa sắc.","Dung dịch phải loãng, trong suốt và sử dụng bức xạ có bước sóng xác định.","Dung dịch phải có nồng độ rất cao và sử dụng ánh sáng trắng.","Chất phân tích phải phản xạ hoàn toàn bức xạ chiếu vào."],"a":1,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":180,"q":"Yếu tố nào sau đây không phù hợp với điều kiện áp dụng định luật Bouguer–Lambert–Beer?","o":["Dung dịch tương đối loãng.","Dung dịch trong suốt.","Bức xạ có bước sóng xác định.","Sử dụng nguồn ánh sáng đa sắc không qua bộ chọn bước sóng."],"a":3,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":181,"q":"Theo định luật Bouguer–Lambert–Beer, độ hấp thụ quang 𝐴được xác định bởi biểu thức:","o":["𝐴= 𝜀𝑙𝐶","𝐴= 𝜀 𝑙𝐶","𝐴= 𝑙 𝜀𝐶","𝐴= 𝐶 𝜀𝑙"],"a":["A","B","C","D"],"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":182,"q":"Đặc điểm nào sau đây mô tả đúng ánh sáng tự nhiên?","o":["Vectơ điện trường chỉ dao động theo một phương xác định.","Vectơ điện trường dao động theo nhiều phương khác nhau trong mặt phẳng vuông góc với phương truyền sóng, không có phương dao động ưu tiên.","Vectơ điện trường chỉ dao động theo hai phương vuông góc cố định.","Vectơ điện trường không thay đổi phương dao động trong quá trình truyền."],"a":1,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":183,"q":"Trong hệ gồm hai bản phân cực Tourmaline, bản thứ nhất và bản thứ hai lần lượt có chức năng gì?","o":["Cả hai bản đều có chức năng phân tích ánh sáng.","Bản thứ nhất đóng vai trò bản phân cực, bản thứ hai đóng vai trò bản phân tích.","Bản thứ nhất đóng vai trò bản phân tích, bản thứ hai đóng vai trò bản phân cực.","Cả hai bản đều có chức năng tạo ra ánh sáng tự nhiên."],"a":1,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":184,"q":"Phương pháp phân cực kế dựa chủ yếu trên hiện tượng nào?","o":["Sự thay đổi cường độ ánh sáng do phản xạ.","Sự quay mặt phẳng phân cực của ánh sáng khi truyền qua chất quang hoạt.","Sự tán xạ ánh sáng trong môi trường đồng nhất.","Sự phát xạ ánh sáng của chất khảo sát."],"a":1,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":185,"q":"Phương pháp phân cực kế có thể được sử dụng để:","o":["Chỉ xác định định tính các chất vô cơ.","Chỉ xác định nhiệt độ của dung dịch.","Xác định một số chất quang hoạt và nồng độ của chúng trong những điều kiện thích hợp.","Xác định trực tiếp khối lượng phân tử của mọi chất trong dung dịch."],"a":2,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":186,"q":"Một ưu điểm của phương pháp phân cực kế trong phân tích là:","o":["Có thể thực hiện phép đo tương đối nhanh và không cần phá hủy mẫu trong quá trình đo.","Luôn cho kết quả chính xác tuyệt đối với mọi loại mẫu.","Không phụ thuộc vào nhiệt độ và bước sóng sử dụng.","Có thể phân tích mọi chất, kể cả những chất không có tính quang hoạt."],"a":0,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":187,"q":"Laser là nguồn bức xạ được tạo ra chủ yếu dựa trên hiện tượng:","o":["Phát xạ tự phát.","Phát xạ cảm ứng.","Phản xạ toàn phần.","Tán xạ ánh sáng."],"a":1,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":188,"q":"Đặc điểm nổi bật của bức xạ laser là:","o":["Tính đơn sắc cao, tính định hướng cao và tính kết hợp cao.","Tính đa sắc cao và tính định hướng thấp.","Cường độ luôn thấp và không có tính kết hợp.","Bước sóng thay đổi liên tục trong quá trình phát xạ."],"a":0,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":189,"q":"Trong y học, laser có thể được ứng dụng chủ yếu trong:","o":["Chẩn đoán và điều trị.","Chỉ chẩn đoán.","Chỉ điều trị.","Chỉ nghiên cứu vật liệu."],"a":0,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":190,"q":"Nội dung nào sau đây không thuộc nhóm ứng dụng của laser trong chẩn đoán y học?","o":["Phân tích phổ bằng kỹ thuật laser.","Kính hiển vi laser.","Đo dòng máu bằng các kỹ thuật Doppler sử dụng laser.","Cộng hưởng từ hạt nhân."],"a":3,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":191,"q":"Xét theo mức công suất và cơ chế tác động, laser dùng trong điều trị có thể được phân thành:","o":["Laser công suất thấp và laser công suất cao.","Laser đơn sắc và laser đa sắc.","Laser nhìn thấy và laser không nhìn thấy.","Laser liên tục và laser tự phát."],"a":0,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":192,"q":"Cơ chế tác dụng chủ yếu của laser công suất thấp trong một số ứng dụng điều trị là:","o":["Gây bốc bay mô bằng nhiệt.","Tạo tác động quang sinh học lên mô, qua đó hỗ trợ một số quá trình sinh học và phục hồi mô.","Gây đông tụ toàn bộ mô tại vùng chiếu.","Phá hủy trực tiếp tất cả tế bào trong vùng chiếu."],"a":1,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":193,"q":"Laser công suất cao có thể gây ra tác động nào sau đây đối với mô?","o":["Chỉ gây kích thích quang sinh học mà không gây tác động nhiệt.","Có thể gây cắt, đông tụ hoặc bốc bay mô tùy thuộc vào công suất, thời gian chiếu, mức độ hội tụ và tính chất hấp thụ của mô.","Không thể gây thay đổi cấu trúc mô.","Chỉ gây tác động cơ học mà không gây tác động nhiệt."],"a":1,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":194,"q":"Nhận định nào sau đây không phù hợp với ứng dụng của laser trong nhãn khoa?","o":["Laser có thể được sử dụng trong một số kỹ thuật điều trị bệnh lý võng mạc.","Laser có thể tạo ra tác động nhiệt có kiểm soát lên mô trong một số kỹ thuật điều trị.","Laser có thể được ứng dụng trong một số thủ thuật và phẫu thuật nhãn khoa.","Laser chỉ có tác dụng trong chẩn đoán và không có ứng dụng điều trị trong nhãn khoa."],"a":3,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":195,"q":"Laser CO₂ có thể được ứng dụng trong điều trị một số tổn thương da thông qua:","o":["Tác động nhiệt và bóc tách mô có kiểm soát.","Tác động ion hóa trực tiếp lên toàn bộ tế bào da.","Thay đổi thành phần hóa học của máu.","Tạo từ trường cục bộ trên bề mặt da."],"a":0,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":196,"q":"Nhận định nào sau đây không phù hợp với ứng dụng của laser CO₂ trong ngoại khoa?","o":["Có thể được sử dụng như một công cụ cắt hoặc bóc tách mô trong một số phẫu thuật.","Có thể tạo hiệu ứng nhiệt tại vùng mô được chiếu.","Có thể hỗ trợ kiểm soát tổn thương mô trong một số thủ thuật.","Chỉ được sử dụng để chẩn đoán và không có ứng dụng trong phẫu thuật."],"a":3,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":197,"q":"Một ưu điểm tiềm năng của laser trong một số kỹ thuật ngoại khoa là:","o":["Có thể tạo tác động tương đối khu trú lên mô và hỗ trợ kiểm soát vùng can thiệp.","Luôn loại bỏ hoàn toàn nguy cơ tổn thương mô lành.","Không cần người thực hiện có kỹ năng chuyên môn.","Không phụ thuộc vào công suất và thời gian chiếu."],"a":0,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":198,"q":"Nhận định nào sau đây không phù hợp với ứng dụng của laser trong điều trị nội khoa?","o":["Laser công suất thấp có thể được nghiên cứu và ứng dụng trong hỗ trợ điều trị một số bệnh lý.","Một số laser có thể tạo ra tác động quang sinh học trên mô.","Laser có thể được ứng dụng trong một số phương pháp điều trị không xâm lấn hoặc ít xâm lấn.","Laser trong điều trị nội khoa luôn gây phá hủy mô bằng hiệu ứng nhiệt."],"a":3,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":199,"q":"Nhận định nào sau đây phù hợp với ứng dụng của laser trong một số kỹ thuật hỗ trợ châm cứu?","o":["Laser có thể tạo kích thích quang học tại vị trí huyệt.","Laser chỉ có thể được sử dụng để tạo hình ảnh huyệt.","Laser không thể tạo ra bất kỳ tác động sinh học nào lên mô.","Laser chỉ được sử dụng trong chẩn đoán hình ảnh."],"a":0,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":200,"q":"Laser có thể được nghiên cứu và ứng dụng hỗ trợ trong một số lĩnh vực điều trị thuộc:","o":["Vật lý trị liệu, phục hồi chức năng và một số kỹ thuật y học chuyên ngành.","Chỉ điều trị các bệnh truyền nhiễm.","Chỉ điều trị các bệnh về máu.","Chỉ điều trị các bệnh lý của hệ thần kinh trung ương."],"a":0,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":201,"q":"Một ưu điểm của kỹ thuật kích thích huyệt bằng laser so với châm cứu bằng kim trong một số trường hợp là:","o":["Không cần đưa kim xuyên qua da và có thể thực hiện kích thích tại vùng huyệt bằng ánh sáng.","Luôn cho hiệu quả điều trị cao hơn châm cứu bằng kim.","Không cần xác định vị trí huyệt.","Không cần kiểm soát công suất và thời gian chiếu."],"a":0,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":202,"q":"Nguyên lý của liệu pháp quang động trong điều trị ung thư dựa trên:","o":["Sử dụng tia laser để đốt trực tiếp toàn bộ khối u mà không cần chất nhạy quang.","Sử dụng chất nhạy quang và ánh sáng có bước sóng thích hợp để tạo ra các tác nhân gây tổn thương tế bào đích.","Chỉ sử dụng hóa chất mà không cần tác động của ánh sáng.","Sử dụng tia laser để làm tăng nhiệt độ toàn thân nhằm tiêu diệt tế bào ung thư."],"a":1,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":203,"q":"Laser có thể được ứng dụng trong y học ở những lĩnh vực nào sau đây?","o":["Chỉ trong chẩn đoán hình ảnh.","Chỉ trong ngoại khoa.","Trong chẩn đoán, điều trị và hỗ trợ một số kỹ thuật y học chuyên ngành.","Chỉ trong điều trị các bệnh ngoài da."],"a":2,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":204,"q":"Trong ngoại khoa, laser có thể được sử dụng với mục đích:","o":["Đo nhiệt độ mô.","Cắt, bóc tách hoặc xử lý mô trong một số thủ thuật và phẫu thuật phù hợp.","Chỉ tạo hình ảnh chẩn đoán.","Chỉ kích thích thần kinh."],"a":1,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":205,"q":"Trong điều trị một số tổn thương da, laser có thể được sử dụng nhằm:","o":["Chỉ xác định vị trí tổn thương.","Chỉ đo nhiệt độ bề mặt da.","Chỉ tạo hình ảnh mô dưới da.","Tác động có kiểm soát lên mô nhằm xử lý một số tổn thương da."],"a":3,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":206,"q":"Phát biểu nào sau đây đúng về bức xạ hồng ngoại?","o":["Tia hồng ngoại có tần số cao hơn tia tử ngoại.","Tia hồng ngoại có năng lượng photon lớn hơn tia tử ngoại.","Tia hồng ngoại có bước sóng dài hơn và năng lượng photon thấp hơn tia tử ngoại.","Tia hồng ngoại và tia tử ngoại có cùng bước sóng."],"a":2,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":207,"q":"Tác dụng nổi bật của tia hồng ngoại trong một số ứng dụng y học là:","o":["Ion hóa mạnh các phân tử trong mô.","Gây đột biến gen trực tiếp.","Tạo hiệu ứng nhiệt, có thể được khai thác trong một số ứng dụng vật lý trị liệu.","Phá hủy trực tiếp DNA bằng cơ chế ion hóa."],"a":2,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":208,"q":"Phát biểu nào sau đây đúng về tia tử ngoại?","o":["Tia tử ngoại có bước sóng ngắn hơn ánh sáng tím và có năng lượng photon cao hơn ánh sáng nhìn thấy.","Tia tử ngoại có bước sóng dài hơn ánh sáng đỏ.","Tia tử ngoại có năng lượng photon thấp hơn ánh sáng nhìn thấy.","Tia tử ngoại là bức xạ nhìn thấy được bằng mắt thường."],"a":0,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":209,"q":"Trong phân loại thường dùng trong y học, vùng tử ngoại có thể được chia thành:","o":["Tử ngoại vùng UVC, UVB và UVA.","Tử ngoại vùng đỏ, vàng và xanh.","Tử ngoại vùng sóng dài, sóng trung và sóng cực dài.","Tử ngoại vùng vi sóng, hồng ngoại và khả kiến."],"a":0,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":210,"q":"Tác dụng sinh học của tia tử ngoại phụ thuộc đáng kể vào:","o":["Chỉ nhiệt độ môi trường.","Bước sóng và liều chiếu.","Chỉ khoảng cách từ nguồn đến vật.","Chỉ màu sắc của nguồn sáng."],"a":1,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":211,"q":"Phát biểu nào sau đây đúng về ứng dụng của tia X trong y học?","o":["Tia X chỉ được sử dụng trong điều trị và không được sử dụng trong chẩn đoán.","Tia X chỉ được sử dụng để khảo sát mô mềm.","Tia X được sử dụng rộng rãi trong chẩn đoán hình ảnh và cũng có ứng dụng trong xạ trị.","Tia X không có khả năng xuyên qua mô sinh học."],"a":2,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":212,"q":"Trong các bức xạ sau, bức xạ có khả năng đâm xuyên mạnh và thường được sử dụng trong chẩn đoán hình ảnh y khoa là:","o":["Tia X.","Tia hồng ngoại.","Ánh sáng đỏ.","Tia vi sóng."],"a":0,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":213,"q":"Trong các bức xạ điện từ sau, bức xạ có tác dụng nhiệt nổi bật là:","o":["Tia hồng ngoại.","Tia tử ngoại.","Tia X.","Tia gamma."],"a":0,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":214,"q":"Một hạn chế khi sử dụng laser trong phẫu thuật là:","o":["Thiết bị và quy trình sử dụng có thể đòi hỏi chi phí cao, kỹ thuật chuyên môn và kiểm soát an toàn nghiêm ngặt.","Laser không thể tạo tác động khu trú lên mô.","Laser không thể được sử dụng trong bất kỳ loại phẫu thuật nào.","Laser luôn gây tổn thương nghiêm trọng cho toàn bộ mô xung quanh."],"a":0,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":215,"q":"Một chùm sáng phân cực phẳng truyền qua kính phân tích. Bỏ qua sự hấp thụ ánh sáng. Khi cường độ ánh sáng truyền qua kính phân tích bằng 1/4cường độ ánh sáng tới kính phân tích, góc hợp bởi phương dao động của ánh sáng tới và trục truyền của kính phân tích là:","o":["30∘","45∘","60∘","90∘"],"a":2,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":216,"q":"Một chùm sáng phân cực phẳng truyền qua kính phân tích. Khi góc giữa phương dao động của ánh sáng tới và trục truyền của kính phân tích bằng 45∘, bỏ qua sự hấp thụ ánh sáng. Tỉ số giữa cường độ ánh sáng truyền qua và cường độ ánh sáng tới là:","o":["1/4","1/2","3/4","1 CHƯƠNG 7. PHÓNG XẠ SINH HỌC"],"a":1,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":217,"q":"Về phương diện vật lý, cơ chế cơ bản của quá trình truyền năng lượng từ bức xạ vào vật chất là:","o":["Kích thích và ion hóa các nguyên tử, phân tử của vật chất.","Kích thích và cộng hưởng của các nguyên tử, phân tử.","Ion hóa vật chất và phát xạ điện từ.","Hấp thụ và phản xạ hoàn toàn bức xạ."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"},{"n":218,"q":"Tương tác của bức xạ ion hóa với vật chất có thể được phân thành hai nhóm cơ bản là:","o":["Tương tác của hạt mang điện với vật chất và tương tác của photon với vật chất.","Tương tác của hạt không mang điện với vật chất và tương tác của photon với vật chất.","Tương tác của hạt mang điện với vật chất và tương tác của sóng cơ với vật chất.","Tương tác của hạt nhân nguyên tử với vật chất và tương tác của electron với photon."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"},{"n":219,"q":"Tương tác của các hạt mang điện với vật chất chủ yếu bao gồm:","o":["Tương tác với electron nguyên tử và tương tác với hạt nhân nguyên tử.","Tương tác với photon và tương tác với phân tử.","Tương tác với proton quỹ đạo và tương tác với neutron.","Tương tác với nguyên tử và tương tác với sóng điện từ."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"},{"n":220,"q":"Photon năng lượng cao, như tia X và tia gamma, tương tác với vật chất chủ yếu thông qua các hiệu ứng nào sau đây?","o":["Hiệu ứng quang điện, tán xạ Compton và tạo cặp.","Hiệu ứng Compton, tạo cặp và hiệu ứng Hall.","Hiệu ứng tạo cặp, hiệu ứng Hall và tán xạ Rayleigh.","Hiệu ứng Hall, hiệu ứng quang điện và tán xạ Compton."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"},{"n":221,"q":"Photon năng lượng cao như tia X và tia gamma không tương tác với vật chất theo cơ chế nào sau đây?","o":["Hiệu ứng Hall.","Hiệu ứng quang điện.","Tán xạ Compton.","Hiện tượng tạo cặp."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"},{"n":222,"q":"Phát biểu nào sau đây là KHÔNG ĐÚNG về các đại lượng liều bức xạ?","o":["Trong hệ SI, đơn vị của liều hấp thụ là C/kg, còn đơn vị của liều chiếu là J/kg.","Liều hấp thụ là năng lượng trung bình mà bức xạ truyền cho một đơn vị khối lượng vật chất và được xác định bởi (D = Δ E/Δm).","Liều chiếu là đại lượng đặc trưng cho khả năng ion hóa của tia X hoặc tia gamma trong không khí.","Đơn vị SI của liều hấp thụ là gray (Gy), với (1,Gy = 1,J/kg)."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"},{"n":223,"q":"Những yếu tố nào sau đây có ảnh hưởng đến hiệu ứng sinh học của bức xạ ion hóa?","o":["Liều bức xạ, suất liều, loại bức xạ, năng lượng bức xạ và thời gian chiếu xạ.","Chỉ phụ thuộc vào liều bức xạ và không phụ thuộc vào loại bức xạ.","Chỉ phụ thuộc vào năng lượng bức xạ và không phụ thuộc vào suất liều.","Chỉ phụ thuộc vào thời gian chiếu xạ và diện tích cơ thể được chiếu."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"},{"n":224,"q":"Các yếu tố thuộc môi trường chiếu xạ có thể ảnh hưởng đến hiệu ứng sinh học của bức xạ ion hóa là:","o":["Nhiệt độ, nồng độ oxy, hàm lượng nước và sự hiện diện của các chất bảo vệ bức xạ.","Áp suất, độ cao, từ trường và độ dẫn điện của môi trường.","Nhiệt độ, hiệu ứng Hall, áp suất và độ nhớt của môi trường.","Hàm lượng nước, độ dẫn điện, hiệu ứng quang điện và hiệu ứng Compton."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"},{"n":225,"q":"Phát biểu nào sau đây là ĐÚNG khi nói về phương pháp chụp ảnh cộng hưởng từ (MRI)?","o":["MRI tạo ảnh dựa trên hiện tượng cộng hưởng từ hạt nhân và không sử dụng bức xạ ion hóa để tạo ảnh.","MRI tạo ảnh dựa trên sự hấp thụ trực tiếp của tia X trong các mô của cơ thể.","MRI sử dụng tia gamma để kích thích các nguyên tử hydro trong cơ thể.","MRI tạo ảnh chủ yếu dựa trên sự suy giảm cường độ của chùm photon năng lượng cao."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"},{"n":226,"q":"Khi thực hiện chụp ảnh cộng hưởng từ (MRI), cơ thể người chủ yếu chịu tác động của những yếu tố vật lý nào sau đây?","o":["Từ trường tĩnh mạnh, gradient từ trường biến thiên và sóng radio.","Từ trường tĩnh mạnh, gradient điện trường và tia X.","Từ trường yếu, sóng siêu âm và tia gamma.","Tia X, tia gamma và sóng radio."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"},{"n":227,"q":"Một hệ thống ghi đo bức xạ sử dụng trong y học thường gồm các bộ phận cơ bản nào sau đây?","o":["Đầu dò bức xạ, nguồn cao áp, bộ khuếch đại, bộ phân tích tín hiệu/phổ và bộ phận hiển thị kết quả.","Đầu dò bức xạ, nguồn thấp áp, bộ phát sóng radio và bộ tạo từ trường.","Nguồn cao áp, bộ phát laser, bộ khuếch đại âm thanh và màn hình hiển thị.","Đầu dò bức xạ, nguồn sáng, bộ tạo nhiệt và bộ phận ghi hình quang học."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"},{"n":228,"q":"Các dạng ghi nhận và hiển thị kết quả thường gặp trong hệ thống ghi đo bức xạ y học bao gồm:","o":["Đếm xung, đo dòng điện trung bình, đo toàn thân và ghi hình.","Đếm xung, đo nhiệt độ, đo áp suất và ghi hình.","Đo dòng điện tức thời, đo điện áp, đo nhiệt độ và ghi hình.","Ghép xung, đo dòng điện trung bình, đo áp suất và ghi âm."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"},{"n":229,"q":"Nội dung nào sau đây KHÔNG phải là một ứng dụng của bức xạ ion hóa trong y học?","o":["Ứng dụng trong kỹ thuật điện học.","Ứng dụng trong chẩn đoán hình ảnh.","Ứng dụng trong điều trị bệnh.","Ứng dụng trong y học hạt nhân."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"},{"n":230,"q":"Các nguyên tắc cơ bản trong bảo vệ và an toàn bức xạ bao gồm:","o":["Biện minh, tối ưu hóa và giới hạn liều.","Tăng liều chiếu, giảm thời gian và tăng năng lượng bức xạ.","Tăng thời gian tiếp xúc, giảm khoảng cách và giảm che chắn.","Chỉ kiểm soát liều đối với nhân viên bức xạ mà không cần kiểm soát đối với công chúng."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"},{"n":231,"q":"Các biện pháp chủ yếu để bảo đảm an toàn khi làm việc với nguồn bức xạ là:","o":["Kiểm soát thời gian tiếp xúc, tăng khoảng cách đến nguồn và sử dụng che chắn thích hợp.","Tăng thời gian tiếp xúc, tăng khoảng cách đến nguồn và giảm che chắn.","Giảm khoảng cách đến nguồn, tăng thời gian tiếp xúc và sử dụng che chắn.","Chỉ sử dụng che chắn mà không cần kiểm soát thời gian và khoảng cách."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"},{"n":232,"q":"Khi làm việc với nguồn phóng xạ kín, các biện pháp bảo vệ cơ bản cần áp dụng là:","o":["Rút ngắn thời gian tiếp xúc, tăng khoảng cách với nguồn và sử dụng che chắn thích hợp.","Kéo dài thời gian tiếp xúc, tăng khoảng cách với nguồn và sử dụng che chắn thích hợp.","Rút ngắn thời gian tiếp xúc, giảm khoảng cách với nguồn và sử dụng che chắn thích hợp.","Tăng thời gian tiếp xúc, giảm khoảng cách với nguồn và sử dụng che chắn thích hợp."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"},{"n":233,"q":"Trong chụp X-quang, kỹ thuật viên cần giảm liều chiếu cho người bệnh nhưng vẫn bảo đảm chất lượng hình ảnh. Biện pháp nào sau đây phù hợp nhất với nguyên tắc tối ưu hóa bảo vệ bức xạ?","o":["Sử dụng liều bức xạ thấp nhất có thể nhưng vẫn bảo đảm chất lượng chẩn đoán.","Tăng liều bức xạ để hình ảnh luôn có chất lượng cao nhất.","Tăng thời gian chiếu xạ để giảm số lần chụp.","Không cần quan tâm đến liều bức xạ nếu người bệnh chỉ chụp một lần."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"},{"n":234,"q":"Một kỹ thuật viên phải làm việc gần nguồn phóng xạ trong thời gian dài. Biện pháp nào sau đây giúp giảm liều chiếu hiệu quả nhất?","o":["Rút ngắn thời gian tiếp xúc, tăng khoảng cách đến nguồn và sử dụng che chắn thích hợp.","Tăng thời gian làm việc gần nguồn để hoàn thành công việc nhanh hơn.","Giảm khoảng cách đến nguồn để thao tác chính xác hơn.","Chỉ sử dụng khẩu trang mà không cần quan tâm đến khoảng cách và che chắn."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"},{"n":235,"q":"Một nhân viên y tế đứng cách nguồn phóng xạ xa hơn trong quá trình thao tác. Nếu các điều kiện khác không đổi, liều bức xạ mà nhân viên nhận được sẽ có xu hướng:","o":["Giảm do cường độ bức xạ giảm khi khoảng cách đến nguồn tăng.","Tăng do năng lượng photon tăng theo khoảng cách.","Không thay đổi vì liều chỉ phụ thuộc vào thời gian chiếu.","Tăng do thời gian truyền của photon trong không khí tăng."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"},{"n":236,"q":"Trong chẩn đoán bằng X-quang, một bệnh nhân được yêu cầu chụp lại do tư thế không đúng. Để hạn chế phơi nhiễm bức xạ không cần thiết, biện pháp phù hợp nhất là:","o":["Kiểm tra tư thế và các thông số kỹ thuật trước khi phát tia để hạn chế số lần chụp lại.","Tăng liều chiếu ngay từ lần đầu để chắc chắn hình ảnh đạt chất lượng cao.","Tăng số lần chụp thử trước khi thực hiện chụp chính thức.","Không cần kiểm tra tư thế vì có thể xử lý mọi sai lệch bằng phần mềm."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"},{"n":237,"q":"Một bệnh nhân có chỉ định chụp MRI vùng đầu. Bệnh nhân cho biết đang sử dụng máy tạo nhịp tim. Nhân viên y tế cần làm gì trước khi tiến hành chụp?","o":["Kiểm tra tính tương thích MRI của thiết bị và thực hiện theo quy trình an toàn MRI.","Tiến hành chụp ngay vì MRI không sử dụng bức xạ ion hóa.","Chỉ cần giảm cường độ từ trường là có thể chụp cho mọi loại máy tạo nhịp tim.","Chỉ cần sử dụng thuốc cản quang để giảm tác động của từ trường."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"},{"n":238,"q":"Trong một phòng chụp X-quang, nhân viên kỹ thuật cần đứng ở vị trí thích hợp trong khi phát tia. Vị trí nào sau đây giúp giảm phơi nhiễm bức xạ tốt hơn?","o":["Đứng phía sau vùng che chắn bức xạ và tránh đứng gần chùm tia sơ cấp.","Đứng càng gần bệnh nhân càng tốt để quan sát rõ quá trình chụp.","Đứng trực tiếp trong chùm tia sơ cấp nhưng giảm thời gian tiếp xúc.","Đứng giữa nguồn tia X và bệnh nhân để giảm lượng tia tán xạ."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"},{"n":239,"q":"Trong y học hạt nhân, một nhân viên vô tình làm đổ một lượng nhỏ chất phóng xạ ra khu vực làm việc. Biện pháp xử lý phù hợp nhất là:","o":["Cô lập khu vực, hạn chế phát tán chất phóng xạ và thực hiện quy trình xử lý nhiễm bẩn phóng xạ theo quy định.","Dùng tay lau ngay chất phóng xạ để xử lý nhanh.","Dùng quạt thổi mạnh để chất phóng xạ bay ra khỏi phòng.","Đổ thêm nước vào khu vực nhiễm bẩn rồi tiếp tục làm việc bình thường."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"},{"n":240,"q":"Một bệnh nhân được chỉ định chụp X-quang nhiều lần trong thời gian ngắn. Khi đánh giá nguy cơ bức xạ, yếu tố nào cần được đặc biệt xem xét?","o":["Tổng liều bức xạ mà bệnh nhân đã nhận và sự cần thiết của từng lần chiếu.","Chỉ thời gian thực hiện lần chụp gần nhất.","Chỉ khoảng cách từ bệnh nhân đến máy X-quang.","Chỉ kích thước của phòng chụp."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"},{"n":241,"q":"Trong một cơ sở y tế sử dụng nguồn bức xạ, người phụ trách yêu cầu nhân viên thực hiện các biện pháp nhằm duy trì phơi nhiễm ở mức thấp nhất hợp lý nhưng vẫn bảo đảm mục đích chuyên môn. Yêu cầu này phù hợp với nguyên tắc nào?","o":["Nguyên tắc tối ưu hóa bảo vệ bức xạ (ALARA).","Nguyên tắc tăng liều để nâng cao hiệu quả bức xạ.","Nguyên tắc loại bỏ hoàn toàn mọi nguồn bức xạ.","Nguyên tắc tăng thời gian tiếp xúc để giảm số lần thao tác."],"a":0,"ch":"CHƯƠNG 7. PHÓNG XẠ SINH HỌC"}];
const KEY="lysin h241_v1".replace(" ","");
let S={wrong:[],done:[]};
try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=document.getElementById("app");
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let cfg={shuffleOpt:true,from:1,to:241,cnt:40};
let run=null;

function home(){
  const w=S.wrong.length,d=S.done.length;
  $.innerHTML=`<h1>Ôn tập Vật lý y sinh học – 241 câu</h1>
  <div class="s">Bộ câu hỏi lấy từ tài liệu PDF · 241 câu</div><div class="s">Đã thuộc <b>${d}</b>/241 · Đang sai <b>${w}</b> câu</div>
  <div class="bar" style="margin:8px 0"><i style="width:${d/2.41}%"></i></div>
  <div class="c"><b>Chọn cách học</b>
   <div class="g" style="margin-top:10px">
    <button class="m" onclick="start('seq')"><b>Theo thứ tự</b><span>Từ câu ${cfg.from} đến ${cfg.to}</span></button>
    <button class="m" onclick="start('rand')"><b>Ngẫu nhiên</b><span>Trộn trong khoảng đã chọn</span></button>
    <button class="m" onclick="start('wrong')" ${w?"":"disabled"}><b>Ôn câu sai</b><span>${w} câu</span></button>
    <button class="m" onclick="start('new')" ${d<241?"":"disabled"}><b>Câu chưa thuộc</b><span>${241-d} câu</span></button>
    <button class="m" onclick="start('exam')"><b>Thi thử</b><span>${cfg.cnt} câu ngẫu nhiên, chấm điểm cuối</span></button>
    <button class="m" onclick="if(confirm('Xóa toàn bộ tiến độ?')){S={wrong:[],done:[]};save();home()}"><b>Làm lại từ đầu</b><span>Xóa tiến độ</span></button>
   </div></div>
  <div class="c"><b>Tùy chỉnh</b>
   <label><input type="checkbox" id="sh" ${cfg.shuffleOpt?"checked":""} onchange="cfg.shuffleOpt=this.checked"> Xáo trộn thứ tự đáp án (nên bật để không học vẹt theo vị trí A/B/C/D)</label>
   <label>Từ câu <input type="number" id="f" min="1" max="241" value="${cfg.from}" onchange="cfg.from=+this.value||1"> đến <input type="number" id="t" min="1" max="241" value="${cfg.to}" onchange="cfg.to=+this.value||241"></label>
   <label>Số câu thi thử <input type="number" min="5" max="241" value="${cfg.cnt}" onchange="cfg.cnt=+this.value||40"></label>
  </div>`;
}
function start(mode){
  let lo=Math.max(1,Math.min(cfg.from,cfg.to)),hi=Math.min(241,Math.max(cfg.from,cfg.to));
  let pool=Q.filter(q=>q.n>=lo&&q.n<=hi);
  if(mode==="wrong")pool=Q.filter(q=>S.wrong.includes(q.n));
  if(mode==="new")pool=Q.filter(q=>!S.done.includes(q.n)&&q.n>=lo&&q.n<=hi);
  if(mode==="rand"||mode==="wrong"||mode==="new")pool=shuf(pool);
  if(mode==="exam")pool=shuf(Q).slice(0,Math.min(cfg.cnt,241));
  if(!pool.length){alert("Không có câu nào trong lựa chọn này.");return}
  run={mode,list:pool,i:0,ok:0,bad:[],ans:null};
  show();
}
function show(){
  const q=run.list[run.i],nOpt=q.o.length;
  if(!q.ord)q.ord=cfg.shuffleOpt?shuf([...Array(nOpt).keys()]):[...Array(nOpt).keys()];
  const labels="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const chapter=q.ch?`<div class="s" style="margin-top:8px">${esc(q.ch)}</div>`:"";
  $.innerHTML=`<div class="top"><button onclick="if(confirm('Thoát về trang chính?'))home()">← Thoát</button><span>Câu ${run.i+1}/${run.list.length} · (đề số ${q.n}) · Đúng ${run.ok}</span></div>
  <div class="bar"><i style="width:${run.i/run.list.length*100}%"></i></div>
  <div class="c">${chapter}<div class="q">${esc(q.q)}</div><div id="ops">${q.ord.map((oi,k)=>`<button class="o" data-k="${k}" onclick="pick(${k})"><span class="k">${labels[k]}.</span>${esc(q.o[oi])}</button>`).join("")}</div>
  <div class="row"><span class="s" id="fb"></span><button class="p" id="nx" disabled onclick="next()">${run.i+1===run.list.length?"Xem kết quả":"Câu tiếp →"}</button></div></div>
  <div class="s">Phím tắt: A/B/C/D hoặc 1–4 để chọn, Enter hoặc → để tiếp tục</div>`;
  run.ans=null;
}
function pick(k){
  if(run.ans!==null)return;
  const q=run.list[run.i],accepted=Array.isArray(q.a)?q.a:[q.a];
  const rightPos=accepted.map(x=>q.ord.indexOf(x));
  run.ans=k;
  document.querySelectorAll(".o").forEach(b=>{const j=+b.dataset.k;if(rightPos.includes(j))b.classList.add("ok");else if(j===k)b.classList.add("no")});
  const fb=document.getElementById("fb"),correct=rightPos.includes(k),labels="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  if(correct){run.ok++;fb.textContent=accepted.length>1?"✓ Chấp nhận":"✓ Chính xác";fb.style.color="var(--ok)";S.wrong=S.wrong.filter(n=>n!==q.n);if(!S.done.includes(q.n))S.done.push(q.n)}
  else{run.bad.push(q);fb.textContent="✗ Sai – đáp án đúng là "+accepted.map(x=>labels[x]).join(", ");fb.style.color="var(--no)";if(!S.wrong.includes(q.n))S.wrong.push(q.n);S.done=S.done.filter(n=>n!==q.n)}
  save();document.getElementById("nx").disabled=false;
}
function next(){if(run.ans===null)return;run.list[run.i].ord=null;if(++run.i>=run.list.length)return result();show();}
function result(){
  const n=run.list.length,pc=Math.round(run.ok/n*100);
  $.innerHTML=`<div class="c" style="text-align:center"><div class="s">Kết quả</div><div class="big">${run.ok}/${n}</div><div class="s">${pc}% đúng</div>
  <div class="row" style="justify-content:center"><button onclick="home()">Về trang chính</button>${run.bad.length?`<button class="p" onclick="start('wrong')">Ôn lại câu sai</button>`:""}</div></div>
  ${run.bad.length?`<div class="c"><b>Các câu làm sai (${run.bad.length})</b>${run.bad.map(q=>`<div class="wr"><b>Câu ${q.n}.</b> ${esc(q.q)}<br><em>Đáp án: ${Array.isArray(q.a)?q.a.map(x=>esc(q.o[x])).join(" / "):esc(q.o[q.a])}</em></div>`).join("")}</div>`:`<div class="c">Bạn trả lời đúng tất cả!</div>`}`;
}
document.addEventListener("keydown",e=>{
  if(!run||!document.getElementById("ops"))return;
  const m={a:0,b:1,c:2,d:3,1:0,2:1,3:2,4:3}[e.key.toLowerCase()];
  if(m!==undefined&&run.ans===null&&m<run.list[run.i].o.length)pick(m);
  else if((e.key==="Enter"||e.key==="ArrowRight")&&run.ans!==null)next();
});
home();
</script></body></html>
