<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn tập Vật lý y sinh học (241 câu)</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--bd:#dde1e7;--pri:#2563eb;--ok:#15803d;--okb:#dcfce7;--no:#b91c1c;--nob:#fee2e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2027;--tx:#e6e8eb;--mut:#9aa3af;--bd:#2d343d;--pri:#60a5fa;--ok:#4ade80;--okb:#14351f;--no:#f87171;--nob:#3b1717}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}.s{color:var(--mut);font-size:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px}
button.p{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:default}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m{text-align:left}.m b{display:block}.m span{font-size:13px;color:var(--mut)}
label{display:flex;gap:8px;align-items:center;margin:8px 0}
input[type=number]{width:80px;font:inherit;padding:6px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px;color:var(--mut)}
.q{font-size:18px;font-weight:600;margin:12px 0}
.o{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.o.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}.o.no{background:var(--nob);border-color:var(--no);color:var(--no)}
.k{font-weight:700;margin-right:6px}
.row{display:flex;gap:8px;justify-content:space-between;margin-top:12px}
.big{font-size:40px;font-weight:700}
.wr{border-top:1px solid var(--bd);padding:8px 0;font-size:14px}.wr em{color:var(--ok);font-style:normal}
@media(max-width:480px){.g{grid-template-columns:1fr}}
</style></head><body><div class="w" id="app"></div>
<script>
const Q=[{"n":1,"q":"Phương pháp gõ trong chẩn đoán y học dựa chủ yếu trên nguyên lý nào?","o":["Phân tích âm thanh phát ra khi gõ lên bề mặt cơ thể để đánh giá các tổ chức, cơ quan bên dưới.","Phân tích sự hấp thụ tia X của các mô trong cơ thể.","Đo sự thay đổi điện thế trên bề mặt da khi kích thích cơ thể.","Phân tích sự phản xạ của sóng siêu âm từ các mô trong cơ thể."],"a":0,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":2,"q":"Chẩn đoán nghe (auscultation) là phương pháp:","o":["Đánh giá sự thay đổi nhiệt độ của các cơ quan thông qua bức xạ nhiệt.","Nghiên cứu và phân tích các âm thanh do cơ thể phát ra nhằm phát hiện hoặc đánh giá những thay đổi bệnh lý.","Ghi nhận tín hiệu điện do hoạt động của tim và não tạo ra.","Đánh giá cấu trúc cơ thể dựa trên sự phản xạ của tia X."],"a":1,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":3,"q":"Trong chẩn đoán nghe, âm thanh từ cơ thể có thể được thu nhận bằng cách nào?","o":["Chỉ bằng cách nghe trực tiếp bằng tai.","Chỉ bằng các đầu dò siêu âm.","Có thể nghe trực tiếp hoặc sử dụng các dụng cụ hỗ trợ như ống nghe.","Chỉ bằng các điện cực đặt trên da."],"a":2,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":4,"q":"Chức năng cơ bản của ống nghe y tế là:","o":["Phát sóng âm vào cơ thể và thu tín hiệu phản xạ.","Chuyển đổi trực tiếp âm thanh thành hình ảnh giải phẫu.","Đo định lượng chính xác tần số của mọi âm thanh trong cơ thể.","Thu nhận, truyền và hỗ trợ làm rõ các âm thanh phát ra từ cơ thể đến tai người nghe."],"a":3,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":5,"q":"Mục đích chính của nghiệm pháp Rinne là:","o":["Xác định ngưỡng nghe của tai ở nhiều tần số khác nhau.","So sánh khả năng dẫn truyền âm qua đường khí và đường xương.","Đánh giá khả năng giữ thăng bằng của hệ tiền đình.","Xác định chính xác vị trí tổn thương của dây thần kinh thính giác."],"a":1,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":6,"q":"Cơ sở vật lý của nghiệm pháp Rinne là:","o":["So sánh cường độ âm thanh giữa tai phải và tai trái.","So sánh thời gian truyền âm qua tai ngoài và tai giữa.","So sánh khả năng nghe âm truyền qua không khí với âm truyền qua xương sọ.","So sánh khả năng nghe ở các tần số khác nhau của âm thoa."],"a":2,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":7,"q":"Kết quả nào sau đây phù hợp với Rinne dương tính?","o":["Dẫn truyền qua xương dài hơn hoặc bằng dẫn truyền qua khí.","Dẫn truyền qua khí dài hơn dẫn truyền qua xương; có thể gặp ở người bình thường hoặc mất thính lực thần kinh–cảm giác.","Dẫn truyền qua xương luôn dài hơn dẫn truyền qua khí ở người bình thường.","Rinne dương tính luôn chứng tỏ người bệnh bị điếc dẫn truyền."],"a":1,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":8,"q":"Trong nghiệm pháp Rinne, nếu bệnh nhân nghe âm thoa qua đường xương lâu hơn hoặc ít nhất bằng đường khí, kết luận phù hợp nhất là:","o":["Rinne âm tính, gợi ý giảm thính lực dẫn truyền.","Rinne dương tính, gợi ý giảm thính lực thần kinh–cảm giác.","Rinne dương tính và chắc chắn là thính lực bình thường.","Rinne âm tính và chắc chắn tổn thương dây thần kinh thính giác."],"a":0,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":9,"q":"Hiệu ứng Doppler được hiểu là:","o":["Sự thay đổi biên độ sóng khi sóng truyền qua hai môi trường khác nhau.","Sự thay đổi bước sóng do sóng bị hấp thụ hoàn toàn trong môi trường.","Sự thay đổi tần số quan sát được của sóng do có chuyển động tương đối giữa nguồn và người quan sát.","Sự thay đổi vận tốc truyền sóng do nhiệt độ môi trường thay đổi."],"a":2,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":10,"q":"Trong ứng dụng Doppler để khảo sát dòng máu, khi các tế bào máu chuyển động tương đối về phía đầu dò, tần số tín hiệu Doppler thường:","o":["Tăng so với tần số sóng phát ra.","Giảm về bằng không.","Không thay đổi trong mọi trường hợp.","Chỉ thay đổi biên độ mà không thay đổi tần số."],"a":0,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":11,"q":"Trong chẩn đoán y học, siêu âm Doppler chủ yếu được sử dụng để:","o":["Đo mật độ xương và phát hiện gãy xương.","Đánh giá chuyển động của các tế bào máu và đặc trưng của dòng máu trong mạch.","Đo hoạt động điện của cơ tim.","Xác định thành phần hóa học của máu."],"a":1,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":12,"q":"Một trong những ứng dụng quan trọng của siêu âm Doppler là:","o":["Đánh giá tình trạng tuần hoàn và hỗ trợ phát hiện các bất thường về mạch máu hoặc tim.","Xác định chính xác nồng độ glucose trong máu mà không cần xét nghiệm.","Đo trực tiếp điện thế hoạt động của tế bào thần kinh.","Xác định thành phần nguyên tố của mô bằng phổ hấp thụ ánh sáng."],"a":0,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":13,"q":"Nguyên lý cơ bản của siêu âm chẩn đoán là:","o":["Sử dụng tia X truyền qua cơ thể để tạo ảnh.","Sử dụng sóng điện từ và phân tích hiệu ứng quang điện.","Phát sóng siêu âm vào cơ thể, thu nhận và phân tích các tín hiệu truyền qua hoặc phản xạ từ các mô.","Đo sự phát xạ nhiệt tự nhiên của các cơ quan."],"a":2,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":14,"q":"Tại các mặt phân cách giữa những môi trường có trở kháng âm khác nhau, sóng siêu âm có thể:","o":["Chỉ bị hấp thụ hoàn toàn.","Bị phản xạ và truyền qua với mức độ phụ thuộc vào sự khác biệt trở kháng âm giữa các môi trường.","Luôn truyền qua mà không bị thay đổi."],"a":1,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":15,"q":"Vì sao không khí giữa đầu dò và da cần được loại bỏ khi siêu âm chẩn đoán?","o":["Vì không khí làm tăng nhiệt độ của đầu dò.","Vì không khí làm tăng tần số của sóng siêu âm.","Vì không khí có trở kháng âm rất khác so với mô mềm, gây phản xạ mạnh và làm giảm truyền năng lượng siêu âm vào cơ thể.","Vì không khí làm giảm độ phân giải của màn hình siêu âm."],"a":2,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":16,"q":"Mục đích chính của gel tiếp âm trong siêu âm chẩn đoán là:","o":["Tạo thêm một nguồn phát siêu âm giữa đầu dò và da.","Làm tăng nhiệt độ tại vùng khảo sát.","Loại bỏ lớp không khí giữa đầu dò và da, qua đó cải thiện sự truyền sóng siêu âm.","Ngăn hoàn toàn mọi sự phản xạ của sóng tại các mô."],"a":2,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":17,"q":"Trong siêu âm, chế độ A-mode (Amplitude mode) biểu diễn chủ yếu:","o":["Biên độ tín hiệu phản xạ theo chiều sâu/vị trí của các mặt phân cách.","Độ sáng của các điểm ảnh trong một ảnh hai chiều.","Sự chuyển động của cấu trúc theo thời gian.","Vận tốc dòng máu theo thời gian."],"a":0,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":18,"q":"Chế độ M-mode (Motion mode) được sử dụng chủ yếu để:","o":["Tạo ảnh ba chiều của cơ quan.","Biểu diễn sự chuyển động của các cấu trúc theo thời gian, đặc biệt hữu ích trong siêu âm tim.","Đo trực tiếp thành phần hóa học của mô.","Đánh giá sự hấp thụ tia X của cơ thể."],"a":1,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":19,"q":"Chế độ B-mode trong siêu âm chẩn đoán có đặc điểm:","o":["Biểu diễn biên độ tín hiệu phản xạ dưới dạng một đường tín hiệu đơn.","Biểu diễn chuyển động của cấu trúc theo thời gian trên một đường quét.","Tạo ảnh hai chiều trong đó độ sáng của điểm ảnh liên quan đến cường độ tín hiệu phản xạ.","Chỉ được sử dụng để đo vận tốc dòng máu."],"a":2,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":20,"q":"Phát biểu nào sau đây không đúng về siêu âm Doppler?","o":["Có thể được sử dụng để đánh giá vận tốc và hướng dòng máu.","Có ứng dụng trong khảo sát hệ tuần hoàn ngoại vi.","Có thể hỗ trợ đánh giá chức năng tim và các bất thường về huyết động.","Không thể cung cấp thông tin liên quan đến vận tốc dòng máu."],"a":3,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":21,"q":"Các tác dụng sinh học cơ bản của siêu âm trong mô có thể bao gồm:","o":["Chỉ có tác dụng nhiệt.","Chỉ có tác dụng cơ học và hoàn toàn không ảnh hưởng đến chức năng sinh lý.","Tác dụng cơ học, nhiệt và trong một số điều kiện có thể có tác dụng hóa học.","Chủ yếu là tác dụng ion hóa tương tự tia X."],"a":2,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":22,"q":"Tác dụng cơ học của siêu âm trong mô liên quan trực tiếp đến:","o":["Sự ion hóa các phân tử do bức xạ năng lượng cao.","Sự nén và giãn tuần hoàn của môi trường, tạo ra dao động cơ học của các phần tử.","Sự phát sáng của các phân tử trong mô.","Sự chuyển đổi hoàn toàn năng lượng âm thành điện năng."],"a":1,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":23,"q":"Khi sử dụng siêu âm với cường độ cao và các điều kiện thích hợp, hiện tượng nào sau đây có thể xảy ra?","o":["Cavitation, gia nhiệt đáng kể và tổn thương mô; các hiệu ứng này có thể được khai thác có kiểm soát trong một số kỹ thuật điều trị.","Sóng siêu âm mất hoàn toàn năng lượng và không thể tương tác với mô.","Mọi phân tử trong vùng khảo sát đều bị ion hóa như khi sử dụng tia X.","Nhiệt độ mô luôn giảm bất kể cường độ và thời gian chiếu."],"a":0,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":24,"q":"Phát biểu nào sau đây không đúng về tác dụng nhiệt của siêu âm?","o":["Một phần năng lượng siêu âm bị mô hấp thụ và chuyển thành nhiệt.","Mức độ gia nhiệt phụ thuộc vào cường độ, thời gian tác động và tính chất của mô.","Tác dụng nhiệt có thể góp phần tạo ra giãn mạch và giảm đau trong một số ứng dụng siêu âm điều trị.","Toàn bộ năng lượng siêu âm đi vào cơ thể đều chuyển hoàn toàn thành nhiệt."],"a":3,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":25,"q":"Sóng siêu âm được phân biệt với âm nghe được chủ yếu dựa trên đặc điểm nào?","o":["Có khả năng truyền được trong chân không.","Có tần số cao hơn giới hạn nghe của tai người, thường lớn hơn khoảng 20 kHz.","Luôn có biên độ lớn hơn sóng âm nghe được.","Là một dạng bức xạ điện từ có bước sóng rất ngắn."],"a":1,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":26,"q":"Trở kháng âm của một môi trường có ý nghĩa quan trọng trong siêu âm vì:","o":["Quyết định hoàn toàn tần số phát của đầu dò.","Xác định nhiệt độ tuyệt đối của mô.","Ảnh hưởng đến mức độ phản xạ và truyền qua của sóng tại mặt phân cách giữa các môi trường.","Chỉ quyết định vận tốc của đầu dò khi di chuyển trên da."],"a":2,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":27,"q":"Trong siêu âm chẩn đoán, khi tăng tần số của đầu dò, đặc điểm nào sau đây thường đúng?","o":["Khả năng phân giải không gian được cải thiện nhưng độ xuyên sâu có xu hướng giảm.","Độ xuyên sâu luôn tăng và độ phân giải luôn giảm.","Cả độ xuyên sâu và độ phân giải đều luôn tăng.","Tần số không ảnh hưởng đến độ phân giải hoặc độ xuyên sâu."],"a":0,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":28,"q":"Trong siêu âm Doppler, thông tin về hướng dòng máu có thể được xác định dựa chủ yếu vào:","o":["Chỉ dựa vào độ sáng của ảnh B-mode.","Sự thay đổi nhiệt độ của mô khi dòng máu chuyển động.","Sự thay đổi tần số Doppler và mối quan hệ hình học giữa dòng máu với chùm siêu âm.","Sự thay đổi trở kháng điện của máu."],"a":2,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":29,"q":"Phát biểu nào sau đây phù hợp nhất với nguyên tắc an toàn khi sử dụng siêu âm chẩn đoán?","o":["Có thể sử dụng công suất và thời gian chiếu tùy ý vì siêu âm hoàn toàn không gây tác động sinh học.","Nên sử dụng mức năng lượng và thời gian chiếu thấp nhất cần thiết để đạt được thông tin chẩn đoán mong muốn.","Chỉ cần giảm tần số là có thể loại bỏ hoàn toàn mọi nguy cơ sinh học.","Tác dụng sinh học của siêu âm không phụ thuộc vào cường độ và thời gian tác động."],"a":1,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":30,"q":"Trong siêu âm điều trị, việc lựa chọn cường độ, tần số, chế độ phát và thời gian tác động cần được kiểm soát vì:","o":["Các thông số này ảnh hưởng đến mức độ truyền năng lượng và các tác dụng cơ học, nhiệt của siêu âm trong mô.","Chúng chỉ ảnh hưởng đến độ sáng của hình ảnh siêu âm.","Chúng không ảnh hưởng đến sự tương tác giữa siêu âm và mô.","Chỉ tần số quyết định hoàn toàn tác dụng điều trị, các thông số khác không có vai trò. CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"],"a":0,"ch":"CHƯƠNG I. SÓNG ÂM, SIÊU ÂM VÀ ỨNG DỤNG"},{"n":31,"q":"Đặc điểm nào sau đây KHÔNG đúng với hệ thống mạch máu trong cơ thể người?","o":["Động mạch đưa máu từ tim đến các cơ quan và mô.","Tĩnh mạch đưa máu từ các mô trở về tim.","Mao mạch là nơi chủ yếu diễn ra trao đổi chất giữa máu và mô.","Máu luôn chảy trong mạch với vận tốc như nhau ở mọi vị trí."],"a":3,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":32,"q":"Phát biểu nào sau đây KHÔNG đúng về cấu tạo và chức năng của hệ thống mạch máu?","o":["Thành động mạch thường dày và đàn hồi hơn thành tĩnh mạch.","Mao mạch có thành rất mỏng, thuận lợi cho quá trình trao đổi chất.","Tĩnh mạch có khả năng chứa một lượng máu tương đối lớn.","Mao mạch có thành dày gồm nhiều lớp cơ trơn để điều hòa huyết áp."],"a":3,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":33,"q":"Phát biểu nào sau đây đúng về hệ thống mạch máu và ý nghĩa của nó trong phòng ngừa, chẩn đoán và điều trị bệnh?","o":["Đo huyết áp chỉ có ý nghĩa đánh giá hoạt động của tim, không liên quan đến mạch máu.","Sự thay đổi đường kính mạch máu có thể ảnh hưởng đến huyết áp và lưu lượng máu đến các mô.","Tắc nghẽn mạch máu không ảnh hưởng đáng kể đến sự cung cấp oxy cho mô.","Tất cả các bệnh về mạch máu đều có thể được chẩn đoán chỉ bằng cách đo huyết áp."],"a":1,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":34,"q":"Phát biểu nào sau đây KHÔNG đúng về sự thay đổi của huyết áp và vận tốc dòng máu khi máu chảy qua các đoạn khác nhau của hệ tuần hoàn?","o":["Huyết áp giảm dần khi máu đi từ động mạch lớn đến mao mạch.","Vận tốc dòng máu giảm mạnh ở hệ mao mạch.","Tổng tiết diện của hệ mao mạch rất lớn so với động mạch lớn.","Vận tốc dòng máu lớn nhất tại hệ mao mạch do tổng tiết diện của mao mạch lớn."],"a":3,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":35,"q":"Khi máu di chuyển từ động mạch lớn qua mao mạch rồi trở về tĩnh mạch, đặc điểm nào sau đây là đúng?","o":["Huyết áp tăng dần và vận tốc dòng máu tăng dần.","Huyết áp giảm dần, trong khi vận tốc dòng máu giảm mạnh ở mao mạch rồi tăng trở lại ở tĩnh mạch.","Huyết áp không thay đổi nhưng vận tốc dòng máu giảm liên tục.","Huyết áp giảm dần và vận tốc dòng máu luôn tăng dần."],"a":1,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":36,"q":"Trong cơ thể sống, vật chất có thể được vận chuyển bằng những phương thức nào sau đây?","o":["Khuếch tán, lọc, thẩm thấu và vận chuyển chủ động.","Khuếch tán, bay hơi, ngưng tụ và lọc.","Đối lưu, bay hơi, thẩm thấu và kết tinh.","Lọc, đông đặc, khuếch tán và bay hơi."],"a":0,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":37,"q":"Phát biểu nào sau đây đúng về hiện tượng khuếch tán trong cơ thể sinh vật?","o":["Các phân tử luôn di chuyển từ nơi có nồng độ thấp đến nơi có nồng độ cao.","Khuếch tán là sự vận chuyển chất theo gradient nồng độ và không nhất thiết cần cung cấp năng lượng từ ATP.","Khuếch tán chỉ xảy ra đối với các phân tử nước.","Khuếch tán luôn cần protein vận chuyển trên màng."],"a":1,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":38,"q":"Phát biểu nào sau đây KHÔNG đúng về hiện tượng khuếch tán trong cơ thể sinh vật?","o":["Khuếch tán có xu hướng làm giảm chênh lệch nồng độ giữa các vùng.","Khuếch tán có thể xảy ra trong chất khí, chất lỏng và qua một số màng sinh học.","Khuếch tán luôn cần năng lượng ATP do tế bào cung cấp.","Tốc độ khuếch tán phụ thuộc vào gradient nồng độ và tính chất của môi trường."],"a":2,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":39,"q":"Phát biểu nào sau đây đúng về sự vận chuyển vật chất theo cơ chế lọc?","o":["Lọc là sự vận chuyển chất do chênh lệch áp suất qua một màng hoặc thành mao mạch.","Lọc luôn xảy ra theo chiều từ nơi có nồng độ chất tan thấp đến nơi có nồng độ cao.","Lọc chỉ xảy ra ở màng tế bào và không xảy ra ở mao mạch.","Lọc luôn cần năng lượng ATP."],"a":0,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":40,"q":"Phát biểu nào sau đây đúng về hiện tượng siêu lọc trong cơ thể sống?","o":["Siêu lọc là quá trình vận chuyển chất qua màng dưới tác dụng của chênh lệch áp suất, với khả năng giữ lại một số thành phần có kích thước lớn.","Siêu lọc là quá trình vận chuyển chất hoàn toàn ngược gradient nồng độ.","Siêu lọc chỉ xảy ra trong tế bào thực vật.","Siêu lọc luôn cần ATP để vận chuyển nước qua màng."],"a":0,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":41,"q":"Phát biểu nào sau đây KHÔNG đúng về tế bào và màng tế bào?","o":["Màng tế bào có vai trò ngăn cách tế bào với môi trường bên ngoài.","Màng tế bào có tính thấm chọn lọc đối với nhiều chất.","Mọi chất đều có thể tự do đi qua màng tế bào mà không phụ thuộc vào tính chất của màng.","Màng tế bào tham gia điều hòa sự trao đổi chất giữa tế bào và môi trường."],"a":2,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":42,"q":"Mặc dù màng tế bào ở các loại mô khác nhau có thành phần và tính chất lý – hóa khác nhau, đặc điểm chung quan trọng nào vẫn được duy trì?","o":["Đều cho tất cả các chất đi qua tự do.","Đều có tính thấm chọn lọc và tham gia điều hòa trao đổi chất.","Đều có cùng thành phần protein và lipid.","Đều chỉ cho nước đi qua."],"a":1,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":43,"q":"Dựa vào tính chất của các chất có thể đi qua màng sinh học, màng sinh học có thể được phân loại thành các loại cơ bản nào?","o":["Màng thấm hoàn toàn, màng không thấm và màng bán thấm.","Màng lipid, màng protein và màng carbohydrate.","Màng tế bào, màng nhân và màng ty thể.","Màng động mạch, màng tĩnh mạch và màng mao mạch."],"a":0,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":44,"q":"Phương thức nào sau đây KHÔNG phải là cơ chế vận chuyển vật chất qua màng sinh học?","o":["Khuếch tán đơn giản.","Khuếch tán được hỗ trợ.","Vận chuyển chủ động.","Lọc máu bằng tim."],"a":3,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":45,"q":"Dựa vào cơ chế vận chuyển và nhu cầu năng lượng, vận chuyển vật chất qua màng sinh học được chia thành những hình thức cơ bản nào?","o":["Vận chuyển thụ động, vận chuyển chủ động và vận chuyển bằng túi.","Khuếch tán, đối lưu và bay hơi.","Lọc, siêu lọc và kết tinh.","Thẩm thấu, đông đặc và hóa hơi."],"a":0,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":46,"q":"Phát biểu nào sau đây đúng về hiện tượng thẩm thấu?","o":["Thẩm thấu là sự di chuyển của chất tan qua màng bán thấm từ nơi có nồng độ cao đến nơi có nồng độ thấp.","Thẩm thấu là sự di chuyển của nước qua màng bán thấm từ nơi có nồng độ chất tan thấp đến nơi có nồng độ chất tan cao.","Thẩm thấu luôn cần năng lượng ATP.","Thẩm thấu chỉ xảy ra trong tế bào thực vật."],"a":1,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":47,"q":"Phát biểu nào sau đây KHÔNG đúng về hiện tượng thẩm thấu?","o":["Thẩm thấu liên quan đến sự di chuyển của nước qua màng bán thấm.","Sự di chuyển của nước có liên quan đến sự chênh lệch nồng độ chất tan giữa hai phía của màng.","Thẩm thấu là một dạng vận chuyển chủ động cần ATP.","Thẩm thấu có vai trò quan trọng trong việc duy trì cân bằng nước của tế bào."],"a":2,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":48,"q":"Phát biểu nào sau đây KHÔNG đúng về áp suất thẩm thấu của dung dịch?","o":["Áp suất thẩm thấu phụ thuộc vào số lượng tiểu phân chất tan trong dung dịch.","Với các điều kiện thích hợp, nồng độ chất tan càng lớn thì áp suất thẩm thấu càng lớn.","Áp suất thẩm thấu không liên quan đến nồng độ các chất tan trong dung dịch.","Áp suất thẩm thấu có ý nghĩa trong việc giải thích sự dịch chuyển của nước qua màng bán thấm."],"a":2,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":49,"q":"Phát biểu nào sau đây KHÔNG đúng về áp suất thẩm thấu và ý nghĩa sinh lý của nó?","o":["Áp suất thẩm thấu góp phần quyết định sự phân bố nước giữa các khoang dịch trong cơ thể.","Sự thay đổi áp suất thẩm thấu của dịch cơ thể có thể làm thay đổi thể tích tế bào.","Áp suất thẩm thấu không có vai trò trong việc duy trì cân bằng nước của cơ thể.","Các chất tan trong huyết tương góp phần tạo nên áp suất thẩm thấu của máu."],"a":2,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":50,"q":"Phát biểu nào sau đây đúng về mối quan hệ giữa nồng độ chất tan, áp suất thẩm thấu và sự dịch chuyển của nước qua màng bán thấm?","o":["Nồng độ chất tan càng cao thì áp suất thẩm thấu càng thấp.","Nước có xu hướng di chuyển về phía có nồng độ chất tan hiệu dụng cao hơn qua màng bán thấm.","Nước luôn di chuyển từ nơi có áp suất thẩm thấu cao đến nơi có áp suất thẩm thấu thấp.","Sự dịch chuyển của nước không phụ thuộc vào sự chênh lệch nồng độ chất tan."],"a":1,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":51,"q":"Phát biểu nào sau đây KHÔNG đúng về ý nghĩa của áp suất thẩm thấu trong y học?","o":["Có ý nghĩa trong việc lựa chọn dung dịch truyền phù hợp với dịch cơ thể.","Có liên quan đến sự thay đổi thể tích của tế bào khi môi trường dịch thay đổi.","Có ý nghĩa trong việc duy trì cân bằng nước và điện giải.","Không có liên quan đến sự thay đổi thể tích tế bào khi nồng độ chất tan của môi trường thay đổi."],"a":3,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":52,"q":"Dung dịch ưu trương đối với một tế bào có đặc điểm nào sau đây?","o":["Có nồng độ chất tan hiệu dụng thấp hơn bên trong tế bào.","Có áp suất thẩm thấu thấp hơn bên trong tế bào.","Có nồng độ chất tan hiệu dụng cao hơn bên trong tế bào và có xu hướng làm nước đi ra khỏi tế bào.","Có cùng nồng độ chất tan với dịch bên trong tế bào."],"a":2,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":53,"q":"Trong máu, oxy được vận chuyển chủ yếu nhờ thành phần nào sau đây?","o":["Huyết tương dưới dạng oxy hòa tan.","Hemoglobin trong hồng cầu.","Tiểu cầu.","Bạch cầu."],"a":1,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":54,"q":"Sự co và giãn của cơ trơn thành mạch, qua đó làm thay đổi đường kính lòng mạch, chủ yếu được điều hòa bởi yếu tố nào sau đây?","o":["Hệ thần kinh tự chủ, các chất thể dịch và các yếu tố tại chỗ.","Chỉ bởi hoạt động của cơ vân.","Chỉ bởi áp suất khí quyển.","Chỉ bởi số lượng hồng cầu trong máu."],"a":0,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":55,"q":"Ở thực vật, sự vận chuyển nước và muối khoáng từ rễ lên thân, cành và lá chủ yếu được thực hiện qua hệ thống nào?","o":["Mạch rây, nhờ quá trình khuếch tán.","Mạch gỗ, dưới tác động phối hợp của lực hút do thoát hơi nước và các lực liên quan.","Mạch rây, nhờ áp suất thẩm thấu của lá.","Mạch gỗ, chủ yếu nhờ quá trình vận chuyển chủ động của tế bào lá."],"a":1,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":56,"q":"Lực căng cơ có đặc điểm nào sau đây?","o":["Là lực do cơ sinh ra khi cơ co hoặc có xu hướng chống lại sự kéo giãn.","Chỉ xuất hiện khi cơ hoàn toàn không hoạt động.","Luôn tăng tuyến tính theo độ dài của cơ trong mọi điều kiện.","Không phụ thuộc vào trạng thái co hay chiều dài của cơ."],"a":0,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":57,"q":"Khi nhu cầu oxy của cơ thể tăng lên trong quá trình lao động hoặc vận động thể lực, cơ thể chủ yếu thích nghi bằng cơ chế nào sau đây?","o":["Giảm thông khí phổi và giảm lưu lượng tim.","Tăng thông khí phổi, tăng cung lượng tim và tăng cung cấp máu cho các cơ đang hoạt động.","Giảm nhịp tim để tăng thời gian trao đổi khí.","Giảm lưu lượng máu đến cơ để hạn chế tiêu thụ oxy."],"a":1,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":58,"q":"Khi bán kính của một mạch máu giảm, trong điều kiện các yếu tố khác không đổi, sức cản đối với dòng máu sẽ thay đổi như thế nào?","o":["Giảm do vận tốc dòng máu tăng.","Tăng, làm giảm lưu lượng máu qua mạch.","Không thay đổi vì huyết áp không đổi.","Giảm do tổng tiết diện của mạch giảm."],"a":1,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":59,"q":"Một tế bào động vật được đặt trong dung dịch có nồng độ chất tan thấp hơn so với dịch bên trong tế bào. Hiện tượng nào có khả năng xảy ra?","o":["Nước đi vào tế bào, làm tế bào trương lên.","Nước đi ra khỏi tế bào, làm tế bào co lại.","Nước không di chuyển vì màng tế bào không thấm nước.","Chất tan đi vào tế bào cho đến khi tế bào bị mất nước."],"a":0,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":60,"q":"Trong quá trình vận động mạnh, nhịp thở và nhịp tim tăng lên chủ yếu nhằm đáp ứng nhu cầu nào của cơ thể?","o":["Giảm lượng oxy cung cấp cho cơ để hạn chế chuyển hóa.","Tăng cung cấp oxy và tăng vận chuyển các chất cần thiết đến mô, đồng thời tăng thải CO₂.","Giảm lưu lượng máu đến cơ để duy trì huyết áp.","Tăng lượng CO₂ trong máu để kích thích hoạt động của cơ. CHƯƠNG 3. CHẤT LỎNG"],"a":1,"ch":"CHƯƠNG 2. VẬN CHUYỂN VẬT CHẤT TRONG CƠ THỂ SINH VẬT"},{"n":61,"q":"Những yếu tố nào sau đây ảnh hưởng đến độ nhớt của chất lỏng?","o":["Nhiệt độ, bản chất của chất lỏng và nồng độ các chất hòa tan.","Chỉ phụ thuộc vào áp suất của chất lỏng.","Chỉ phụ thuộc vào khối lượng riêng của chất lỏng.","Chỉ phụ thuộc vào thể tích của chất lỏng."],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":62,"q":"Phát biểu nào sau đây KHÔNG đúng khi nói về máu và độ nhớt của máu?","o":["Máu có độ nhớt lớn hơn nước.","Độ nhớt của máu phụ thuộc đáng kể vào hematocrit.","Khi hematocrit tăng, độ nhớt của máu thường tăng.","Độ nhớt của máu không phụ thuộc vào tốc độ biến dạng của dòng chảy."],"a":3,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":63,"q":"Phương pháp nào sau đây có thể được sử dụng để xác định độ nhớt của chất lỏng?","o":["Phương pháp dùng nhớt kế Ostwald.","Phương pháp đo huyết áp Korotkoff.","Phương pháp đo sức căng bề mặt bằng vòng Du Noüy.","Phương pháp đo áp suất bằng áp kế thủy ngân."],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":64,"q":"Phương pháp dùng nhớt kế Ostwald để xác định độ nhớt của chất lỏng dựa chủ yếu trên","o":["sự phụ thuộc của thời gian chảy qua mao quản vào độ nhớt của chất lỏng.","sự thay đổi chiều cao cột chất lỏng do hiện tượng mao dẫn.","lực cần thiết để tách một vòng kim loại khỏi bề mặt chất lỏng.","sự thay đổi áp suất của chất lỏng khi tăng nhiệt độ."],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":65,"q":"Phát biểu nào sau đây KHÔNG đúng về năng lượng bề mặt của chất lỏng?","o":["Các phân tử ở bề mặt chất lỏng có trạng thái năng lượng khác với các phân tử ở bên trong chất lỏng.","Năng lượng bề mặt liên quan đến lực tương tác giữa các phân tử ở lớp bề mặt.","Hệ có xu hướng giảm diện tích bề mặt để giảm năng lượng bề mặt khi các điều kiện khác không đổi.","Năng lượng bề mặt của chất lỏng không liên quan đến sức căng bề mặt."],"a":3,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":66,"q":"Bản chất vật lý của hiện tượng tạo bọt trong chất lỏng được giải thích chủ yếu bởi","o":["sự hình thành các màng mỏng ở bề mặt phân cách khí–lỏng do sức căng bề mặt, trong đó chất hoạt động bề mặt có thể làm bọt bền hơn.","sự biến mất hoàn toàn của lực tương tác giữa các phân tử chất lỏng.","sự tăng khối lượng riêng của chất lỏng khi có khí đi vào.","sự chuyển toàn bộ chất lỏng sang trạng thái khí."],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":67,"q":"Khi nhỏ một giọt dầu không hòa tan vào rượu, dưới tác dụng của sức căng bề mặt, giọt dầu có xu hướng","o":["có dạng gần cầu để giảm diện tích bề mặt ứng với thể tích nhất định.","trải thành một lớp phẳng vô hạn trên bề mặt rượu.","tự động chuyển hoàn toàn thành hơi.","biến thành một giọt có dạng lập phương."],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":68,"q":"Trong một số trường hợp, có thể sử dụng giọt thuốc làm đơn vị tương đối để định lượng thuốc nhỏ mắt hoặc thuốc nhỏ mũi vì","o":["thể tích giọt hình thành phụ thuộc vào sức căng bề mặt, kích thước và hình dạng đầu nhỏ giọt trong những điều kiện xác định.","mọi giọt chất lỏng đều có thể tích hoàn toàn giống nhau независимо vào dụng cụ.","thể tích giọt chỉ phụ thuộc vào khối lượng riêng của thuốc.","sức căng bề mặt không ảnh hưởng đến quá trình hình thành giọt."],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":69,"q":"Trong vệ sinh và chăm sóc y tế, không nên sử dụng các loại vải dễ phát sinh xơ, bụi hoặc tích điện tĩnh như một số loại vải len, lụa để lau các bề mặt hoặc dụng cụ cần kiểm soát nhiễm khuẩn vì","o":["chúng có thể phát sinh xơ bụi, giữ lại vi sinh vật hoặc tích điện tĩnh, làm giảm hiệu quả làm sạch trong một số tình huống.","chúng luôn làm tăng nhiệt độ của bề mặt được lau.","chúng làm tăng độ nhớt của dung dịch sát khuẩn.","chúng luôn làm giảm hoàn toàn sức căng bề mặt của dung dịch sát khuẩn."],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":70,"q":"Trước khi tiêm thuốc vào tĩnh mạch hoặc lấy máu bằng ống tiêm, cần loại bỏ không khí ra khỏi ống tiêm chủ yếu vì","o":["không khí đưa vào lòng mạch có thể tạo bọt khí và trong trường hợp đủ lượng có thể gây tắc mạch khí, đặc biệt nguy hiểm khi tiêm tĩnh mạch.","không khí làm tăng độ nhớt của máu ngay lập tức.","không khí làm giảm sức căng bề mặt của máu nên máu không thể chảy.","không khí làm tăng áp suất thẩm thấu của máu."],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":71,"q":"Sức căng bề mặt của chất lỏng có thể được xác định bằng phương pháp nào sau đây?","o":["Phương pháp ống mao quản.","Phương pháp đo huyết áp.","Phương pháp điện tim.","Phương pháp đo độ dẫn điện của kim loại."],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":72,"q":"Phương pháp vòng Du Noüy được sử dụng để xác định sức căng bề mặt của chất lỏng dựa trên","o":["lực cần thiết để kéo một vòng nhỏ ra khỏi bề mặt chất lỏng.","thời gian chất lỏng chảy qua một mao quản.","chiều cao cột chất lỏng trong ống mao quản.","tốc độ bay hơi của chất lỏng."],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":73,"q":"Phương pháp đo sức căng bề mặt dựa trên việc xác định khối lượng hoặc số lượng giọt hình thành từ đầu một ống mao quản nhỏ được gọi là","o":["phương pháp giọt rơi/đếm giọt.","phương pháp Ostwald.","phương pháp Doppler.","phương pháp Venturi."],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":74,"q":"Cơ sở của phương pháp dùng ống mao quản để xác định sức căng bề mặt của chất lỏng là hiện tượng","o":["mao dẫn, trong đó chiều cao cột chất lỏng trong ống phụ thuộc vào sức căng bề mặt, bán kính ống và góc tiếp xúc.","khuếch tán, trong đó các phân tử di chuyển từ nơi có nồng độ cao đến nơi có nồng độ thấp.","thẩm thấu, trong đó nước đi qua màng bán thấm.","đối lưu, trong đó chất lỏng chuyển động do chênh lệch nhiệt độ."],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":75,"q":"Phát biểu nào sau đây đúng nhất về phương pháp ống mao quản xác định sức căng bề mặt?","o":["Độ cao dâng hoặc hạ của chất lỏng trong ống mao quản liên quan đến sức căng bề mặt, bán kính ống, khối lượng riêng và góc tiếp xúc.","Độ cao cột chất lỏng chỉ phụ thuộc vào bán kính ống mao quản.","Độ cao cột chất lỏng chỉ phụ thuộc vào khối lượng riêng mà không phụ thuộc sức căng bề mặt.","Phương pháp này xác định sức căng bề mặt dựa vào thời gian chất lỏng chảy qua ống."],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":76,"q":"Phát biểu nào sau đây đúng về sức căng mặt ngoài của chất lỏng?","o":["Sức căng mặt ngoài có xu hướng làm giảm diện tích bề mặt tự do của chất lỏng.","Sức căng mặt ngoài chỉ xuất hiện khi chất lỏng chuyển động.","Sức căng mặt ngoài không phụ thuộc vào bản chất và nhiệt độ của chất lỏng.","Sức căng mặt ngoài luôn làm tăng diện tích bề mặt của chất lỏng."],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":77,"q":"Hiện tượng sức căng mặt ngoài của chất lỏng KHÔNG có ứng dụng trực tiếp để","o":["giải thích sự tạo thành giọt chất lỏng.","giải thích một số hiện tượng mao dẫn.","giải thích khả năng của một số côn trùng di chuyển trên mặt nước.","xác định nhóm máu ABO bằng phương pháp ngưng kết hồng cầu."],"a":3,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":78,"q":"Định luật Bernoulli có thể được ứng dụng để giải thích hoặc chế tạo các thiết bị dựa trên sự thay đổi áp suất khi vận tốc dòng chảy thay đổi. Thiết bị nào sau đây KHÔNG dựa chủ yếu trên nguyên lý Bernoulli?","o":["Ống Venturi.","Bình phun khí dung kiểu Venturi.","Một số loại lưu lượng kế dựa trên chênh lệch áp suất.","Cân điện tử dùng cảm biến biến dạng."],"a":3,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":79,"q":"Đối với một mặt cong của chất lỏng, áp suất phụ do sức căng bề mặt gây ra phụ thuộc vào","o":["sức căng bề mặt và độ cong của mặt chất lỏng.","chỉ phụ thuộc vào khối lượng riêng của chất lỏng.","chỉ phụ thuộc vào thể tích chất lỏng.","chỉ phụ thuộc vào nhiệt độ môi trường mà không phụ thuộc vào độ cong."],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":80,"q":"Khi bán kính của một ống mao quản giảm, trong điều kiện chất lỏng và các yếu tố khác không đổi, chiều cao cột chất lỏng dâng trong ống mao quản sẽ","o":["tăng lên.","giảm xuống.","không thay đổi.","tăng rồi giảm tùy thuộc vào thể tích chất lỏng."],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":81,"q":"Hệ tuần hoàn của người gồm những thành phần cơ bản nào?","o":["Tim, hệ thống mạch máu và máu.","Tim, phổi và hệ thần kinh.","Động mạch, phổi và thận.","Máu, hệ tiêu hóa và hệ bạch huyết."],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":82,"q":"Hệ tuần hoàn của người gồm hai vòng tuần hoàn chính là vòng tuần hoàn nhỏ và vòng tuần hoàn lớn. Chức năng chủ yếu của hai vòng này là","o":["đưa máu lưu thông giữa tim – phổi và tim – các cơ quan, qua đó bảo đảm trao đổi khí và cung cấp chất cho mô.","chỉ vận chuyển oxy từ phổi đến tim và không vận chuyển máu đến các mô.","chỉ vận chuyển chất dinh dưỡng từ ruột đến gan.","chỉ vận chuyển các sản phẩm chuyển hóa từ mô đến thận."],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":83,"q":"Vòng tuần hoàn nhỏ (tuần hoàn phổi) có chức năng chủ yếu là đưa","o":["máu từ tâm thất phải đến phổi để trao đổi khí, sau đó đưa máu về tâm nhĩ trái.","máu từ tâm thất trái đến toàn bộ cơ thể rồi trở về tâm nhĩ phải.","máu từ tâm nhĩ phải đến các cơ quan và trở về tâm thất trái.","máu từ phổi trực tiếp đến tất cả các cơ quan mà không qua tim."],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":84,"q":"Vòng tuần hoàn lớn (tuần hoàn hệ thống) có chức năng chủ yếu là đưa","o":["máu từ tâm thất trái đến các cơ quan và mô, sau đó đưa máu trở về tâm nhĩ phải.","máu từ tâm thất phải đến phổi và trở về tâm nhĩ trái.","máu từ tâm nhĩ trái đến phổi và trở về tâm thất phải.","máu từ phổi đến tim mà không đi qua các mô của cơ thể."],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":85,"q":"Khi nhiệt độ của một chất lỏng tăng, độ nhớt của chất lỏng thông thường sẽ","o":["giảm.","tăng.","không thay đổi.","tăng rồi giảm theo thời gian."],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":86,"q":"Trong điều kiện dòng chảy tầng qua một ống có bán kính không đổi, nếu chênh lệch áp suất giữa hai đầu ống tăng thì lưu lượng chất lỏng sẽ","o":["tăng.","giảm.","không thay đổi.","bằng không."],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":87,"q":"Theo định luật Poiseuille, khi bán kính của một mạch máu giảm còn một nửa và các yếu tố khác không đổi, lưu lượng máu qua mạch sẽ thay đổi như thế nào?","o":["Giảm còn 1/2 so với ban đầu.","Giảm còn 1/4 so với ban đầu.","Giảm còn 1/16 so với ban đầu.","Không thay đổi."],"a":2,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":88,"q":"Khi chất lỏng chảy qua một đoạn ống bị thu hẹp, trong điều kiện dòng chảy ổn định và bỏ qua tổn hao năng lượng, theo định luật Bernoulli, vận tốc dòng chảy và áp suất tĩnh trong đoạn ống hẹp sẽ thay đổi như thế nào?","o":["Vận tốc tăng, áp suất tĩnh giảm.","Vận tốc giảm, áp suất tĩnh tăng.","Vận tốc và áp suất đều tăng.","Vận tốc và áp suất đều không thay đổi."],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":89,"q":"Một tế bào hồng cầu được đặt vào dung dịch nhược trương so với huyết tương. Hiện tượng nào có khả năng xảy ra?","o":["Nước đi vào hồng cầu, làm hồng cầu trương lên và có thể bị tan máu.","Nước đi ra khỏi hồng cầu, làm hồng cầu co lại.","Không có sự dịch chuyển nước qua màng hồng cầu.","Chất tan trong dung dịch đi vào hồng cầu làm tế bào mất nước."],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":90,"q":"Trong hệ tuần hoàn, tổng tiết diện của các mao mạch rất lớn so với động mạch lớn. Điều này có ý nghĩa chủ yếu nào đối với dòng máu?","o":["Làm giảm vận tốc dòng máu tại mao mạch, tạo điều kiện thuận lợi cho trao đổi chất.","Làm tăng vận tốc dòng máu tại mao mạch để tăng áp suất máu.","Làm tăng huyết áp tại mao mạch lên mức cao nhất trong hệ tuần hoàn.","Làm cho máu ngừng chảy tại mao mạch. CHƯƠNG 4. NHIỆT HỌC"],"a":0,"ch":"CHƯƠNG 3. CHẤT LỎNG"},{"n":91,"q":"Phát biểu nào sau đây không đúng khi nói về nhiệt động lực học?","o":["Nhiệt động lực học nghiên cứu sự chuyển hóa và trao đổi năng lượng giữa các hệ vật lý.","Nhiệt động lực học nghiên cứu mối quan hệ giữa nhiệt, công và các dạng năng lượng của hệ.","Nhiệt động lực học chỉ nghiên cứu sự truyền nhiệt mà không xét đến sự biến đổi giữa nhiệt và công.","Nhiệt động lực học được ứng dụng trong nhiều lĩnh vực như kỹ thuật, sinh học và y học."],"a":2,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":92,"q":"Phát biểu nào sau đây đúng về hệ nhiệt động?","o":["Hệ nhiệt động chỉ bao gồm các chất khí và không bao gồm chất lỏng hoặc chất rắn.","Hệ nhiệt động là một phần của thế giới được lựa chọn để nghiên cứu, được phân cách với môi trường bằng một ranh giới xác định.","Hệ nhiệt động luôn phải trao đổi đồng thời cả vật chất và năng lượng với môi trường xung quanh.","Hệ nhiệt động luôn ở trạng thái cân bằng và không thể xảy ra bất kỳ quá trình biến đổi nào."],"a":1,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":93,"q":"Nội năng của một hệ nhiệt động là:","o":["Tổng năng lượng vi mô liên quan đến chuyển động và tương tác của các phần tử cấu tạo nên hệ.","Tổng cơ năng của hệ và năng lượng của toàn bộ môi trường bên ngoài hệ.","Năng lượng do toàn bộ vật thể chuyển động đối với một hệ quy chiếu bên ngoài tạo ra.","Tổng nhiệt lượng mà hệ đã nhận được trong suốt quá trình tương tác với môi trường."],"a":0,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":94,"q":"Phát biểu nào sau đây không đúng về nội năng của một hệ nhiệt động?","o":["Nội năng là một hàm trạng thái của hệ nhiệt động.","Nội năng có thể thay đổi khi hệ nhận nhiệt hoặc thực hiện công.","Độ biến thiên nội năng chỉ phụ thuộc vào trạng thái đầu và trạng thái cuối của hệ.","Nội năng của hệ luôn bằng tổng nhiệt lượng mà hệ trao đổi với môi trường trong mọi quá trình."],"a":3,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":95,"q":"Phát biểu nào sau đây đúng về công và nhiệt?","o":["Công và nhiệt là hai đại lượng trạng thái có giá trị xác định riêng cho từng trạng thái của hệ.","Nhiệt và công là hai dạng năng lượng luôn tồn tại sẵn bên trong hệ nhiệt động.","Công và nhiệt là hai phương thức truyền năng lượng giữa hệ và môi trường trong quá trình tương tác.","Công và nhiệt không thể chuyển hóa qua lại trong các quá trình nhiệt động."],"a":2,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":96,"q":"Nguyên lý thứ nhất của nhiệt động lực học phát biểu rằng:","o":["Độ biến thiên nội năng của hệ bằng tổng nhiệt lượng hệ nhận và công do ngoại lực thực hiện lên hệ.","Độ biến thiên nội năng của hệ luôn bằng không trong mọi quá trình nhiệt động.","Nhiệt lượng hệ nhận được luôn bằng công mà hệ thực hiện lên môi trường.","Một hệ có thể sinh công mà không cần nhận năng lượng từ môi trường trong mọi điều kiện."],"a":0,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":97,"q":"Theo nguyên lý thứ nhất của nhiệt động lực học:","o":["Năng lượng có thể tự sinh ra hoặc tự mất đi trong một hệ kín.","Nhiệt lượng chỉ có thể chuyển hóa thành nội năng mà không thể chuyển thành công.","Công có thể được tạo ra mà không cần có sự biến đổi hoặc trao đổi năng lượng.","Năng lượng không tự sinh ra hoặc mất đi mà chỉ chuyển hóa từ dạng này sang dạng khác."],"a":3,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":98,"q":"Hệ quả quan trọng được rút ra từ nguyên lý thứ nhất của nhiệt động lực học là:","o":["Nhiệt luôn tự truyền từ vật lạnh sang vật nóng mà không cần tác động bên ngoài.","Không thể chế tạo động cơ vĩnh cửu loại một, tức thiết bị sinh công mà không nhận năng lượng tương ứng.","Mọi quá trình nhiệt động đều có thể diễn ra theo cả hai chiều với hiệu suất như nhau.","Toàn bộ nhiệt lượng nhận được từ nguồn nóng luôn có thể chuyển hóa hoàn toàn thành công."],"a":1,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":99,"q":"Nếu một hệ nhiệt động thực hiện một chu trình kín thì:","o":["Nội năng của hệ luôn tăng sau mỗi chu trình.","Nội năng của hệ luôn giảm sau mỗi chu trình.","Độ biến thiên nội năng của hệ sau một chu trình bằng không.","Nhiệt lượng trao đổi trong chu trình luôn bằng không."],"a":2,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":100,"q":"Nguyên lý thứ nhất của nhiệt động lực học có ý nghĩa thực tế quan trọng là:","o":["Khẳng định định luật bảo toàn và chuyển hóa năng lượng trong các quá trình vật lý.","Khẳng định mọi dạng năng lượng đều có thể chuyển hóa hoàn toàn thành công có ích.","Khẳng định nhiệt luôn truyền từ nguồn lạnh sang nguồn nóng mà không cần cung cấp công.","Khẳng định hiệu suất của mọi máy nhiệt đều có thể đạt giá trị bằng 100%."],"a":0,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":101,"q":"Theo nguyên lý thứ nhất của nhiệt động lực học, phát biểu nào sau đây đúng?","o":["Một hệ có thể sinh công mà không cần nhận hoặc chuyển hóa bất kỳ dạng năng lượng nào.","Công và nhiệt không liên quan đến sự thay đổi nội năng của hệ.","Khi hệ thực hiện công thì nội năng của hệ luôn tăng.","Khi hệ nhận nhiệt và đồng thời thực hiện công, một phần năng lượng nhận được có thể làm tăng nội năng và phần còn lại chuyển thành công."],"a":3,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":102,"q":"Sự khác biệt cơ bản về hoạt động sinh công của cơ thể sống so với máy nhiệt thông thường là:","o":["Cơ thể sống chỉ có thể sinh công khi nhận nhiệt trực tiếp từ môi trường bên ngoài.","Cơ thể sống chuyển hóa năng lượng hóa học từ chất dinh dưỡng thành công và nhiệt thông qua các quá trình sinh hóa.","Cơ thể sống không tạo ra nhiệt trong quá trình chuyển hóa năng lượng và chỉ tạo ra công cơ học.","Cơ thể sống hoạt động như một động cơ Carnot và luôn có hiệu suất nhiệt cực đại."],"a":1,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":103,"q":"Một số dạng công cơ bản trong cơ thể sống gồm:","o":["Chỉ có công cơ học và công nhiệt được thực hiện trong các cơ quan của cơ thể.","Công cơ học, công nhiệt và công bức xạ là ba dạng công chủ yếu của tế bào.","Công cơ học, công thẩm thấu, công hóa học và công điện là các dạng công quan trọng trong cơ thể sống.","Công cơ học, công âm học, công quang học và công nhiệt là những dạng công chủ yếu trong tế bào."],"a":2,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":104,"q":"Phát biểu nào sau đây không đúng khi nói về các dạng công trong cơ thể?","o":["Công cơ học liên quan đến sự chuyển động của các cơ quan hoặc các cấu trúc trong cơ thể.","Công thẩm thấu liên quan đến sự vận chuyển các chất qua màng chống lại gradient điện hóa hoặc nồng độ.","Công hóa học liên quan đến quá trình tổng hợp các chất có mức năng lượng tự do cao hơn.","Công điện trong cơ thể không liên quan đến sự chênh lệch điện thế và sự vận chuyển ion qua màng tế bào."],"a":3,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":105,"q":"Phát biểu nào sau đây không đúng về một số dạng công cơ bản trong cơ thể?","o":["Công cơ học trong cơ thể chỉ xuất hiện ở cơ vân và hoàn toàn không liên quan đến hoạt động của tim hoặc các cơ trơn.","Công hóa học được sử dụng trong nhiều quá trình tổng hợp các hợp chất cần thiết cho hoạt động sống.","Công thẩm thấu có vai trò quan trọng trong duy trì sự phân bố ion và chất tan giữa các khoang của cơ thể.","Công điện liên quan đến sự duy trì và biến đổi các gradient điện hóa ở màng tế bào."],"a":0,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":106,"q":"Phát biểu nào sau đây đúng về một số dạng công cơ bản trong cơ thể?","o":["Công thẩm thấu chỉ xuất hiện trong hệ tiêu hóa và không liên quan đến hoạt động của tế bào.","Công hóa học chỉ được sử dụng để tổng hợp protein và không tham gia các quá trình chuyển hóa khác.","Công điện chỉ xuất hiện trong tế bào thần kinh mà không có vai trò ở các loại tế bào khác.","Các dạng công trong cơ thể thường được cung cấp năng lượng từ quá trình chuyển hóa chất dinh dưỡng và có mối liên hệ chặt chẽ với nhau."],"a":3,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":107,"q":"Phát biểu nào sau đây đúng?","o":["Năng lượng hóa học của chất dinh dưỡng trong cơ thể chỉ được chuyển thành công cơ học.","Năng lượng hóa học trong cơ thể có thể được chuyển hóa thành công sinh học và nhiệt, đồng thời được sử dụng cho nhiều quá trình sống.","Toàn bộ năng lượng giải phóng trong chuyển hóa chất dinh dưỡng đều được dự trữ dưới dạng ATP.","Nhiệt sinh ra trong cơ thể là một dạng năng lượng hoàn toàn không liên quan đến các quá trình chuyển hóa."],"a":1,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":108,"q":"Theo nguyên lý thứ nhất của nhiệt động lực học, năng lượng từ quá trình chuyển hóa thức ăn trong cơ thể về cơ bản được phân bố thành:","o":["Chỉ công cơ học và không tạo ra nhiệt.","Chỉ nhiệt lượng và không thể tạo ra công sinh học.","Công hữu ích được thực hiện bởi cơ thể và nhiệt lượng tỏa ra môi trường.","Năng lượng điện và năng lượng ánh sáng được phát ra khỏi cơ thể."],"a":2,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":109,"q":"Phát biểu nào sau đây không đúng về cơ chế tỏa nhiệt của cơ thể?","o":["Cơ thể có thể tỏa nhiệt ra môi trường thông qua bức xạ nhiệt.","Cơ thể có thể trao đổi nhiệt với môi trường thông qua dẫn nhiệt và đối lưu.","Bay hơi mồ hôi là một cơ chế quan trọng giúp cơ thể tỏa nhiệt.","Khi nhiệt độ môi trường tăng cao, cơ thể luôn giảm tiết mồ hôi để hạn chế mất nước và giảm nhiệt độ cơ thể."],"a":3,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":110,"q":"Phát biểu nào sau đây đúng về nhiệt lượng sơ cấp và nhiệt lượng thứ cấp trong cơ thể?","o":["Nhiệt sơ cấp phát sinh trực tiếp từ các quá trình chuyển hóa, còn nhiệt thứ cấp liên quan đến sự chuyển hóa tiếp theo của năng lượng công thành nhiệt.","Nhiệt sơ cấp chỉ được tạo ra ở cơ vân, còn nhiệt thứ cấp chỉ được tạo ra ở các cơ quan nội tạng.","Nhiệt sơ cấp và nhiệt thứ cấp là hai đại lượng hoàn toàn độc lập và không liên quan đến chuyển hóa năng lượng.","Nhiệt thứ cấp được tạo ra trước nhiệt sơ cấp và là nguồn năng lượng chính cung cấp cho quá trình chuyển hóa."],"a":0,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":111,"q":"Một trong những quá trình biến đổi năng lượng quan trọng nhất trong cơ thể sống là:","o":["Chuyển đổi trực tiếp toàn bộ nhiệt lượng môi trường thành năng lượng hóa học.","Chuyển đổi hoàn toàn năng lượng hóa học của thức ăn thành công cơ học.","Chuyển đổi năng lượng cơ học của môi trường thành năng lượng hóa học trong tế bào.","Chuyển hóa năng lượng hóa học của chất dinh dưỡng thành ATP, công sinh học và nhiệt thông qua các quá trình chuyển hóa."],"a":3,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":112,"q":"Theo nguyên lý thứ nhất của nhiệt động lực học, phát biểu nào sau đây không thể kết luận?","o":["Năng lượng được bảo toàn trong các quá trình chuyển hóa năng lượng.","Nhiệt lượng luôn tự truyền từ vật có nhiệt độ thấp sang vật có nhiệt độ cao mà không cần cung cấp năng lượng.","Công và nhiệt là hai phương thức trao đổi năng lượng giữa hệ và môi trường.","Độ biến thiên nội năng của hệ liên quan đến nhiệt lượng và công mà hệ trao đổi."],"a":1,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":113,"q":"Sự xuất hiện tất yếu của nguyên lý thứ hai nhiệt động lực học không xuất phát từ kết luận nào sau đây?","o":["Nhiệt không thể tự truyền từ vật lạnh sang vật nóng mà không có tác động bên ngoài.","Không thể biến đổi toàn bộ nhiệt lượng nhận từ một nguồn duy nhất thành công trong một chu trình.","Các quá trình tự nhiên có chiều diễn biến xác định và không phải mọi quá trình ngược đều có thể tự xảy ra.","Năng lượng không được bảo toàn trong quá trình chuyển hóa từ dạng này sang dạng khác."],"a":3,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":114,"q":"Phát biểu nào sau đây đúng về máy nhiệt?","o":["Máy nhiệt là thiết bị thực hiện quá trình chuyển hóa năng lượng giữa nhiệt và công, thông qua một tác nhân nhiệt động.","Máy nhiệt là thiết bị chỉ có khả năng biến công cơ học thành nhiệt mà không thể thực hiện quá trình ngược lại.","Máy nhiệt luôn biến toàn bộ nhiệt lượng nhận từ nguồn nóng thành công cơ học có ích.","Máy nhiệt chỉ có thể hoạt động khi tác nhân nhiệt động là một chất khí lý tưởng."],"a":0,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":115,"q":"Phát biểu nào sau đây không đúng về động cơ nhiệt?","o":["Động cơ nhiệt nhận nhiệt từ nguồn nóng và chuyển một phần năng lượng thành công.","Một phần nhiệt lượng nhận từ nguồn nóng phải được truyền cho nguồn lạnh trong chu trình thực.","Động cơ nhiệt có thể biến toàn bộ nhiệt lượng nhận từ một nguồn nhiệt thành công trong một chu trình kín.","Hiệu suất của động cơ nhiệt được xác định bằng tỷ số giữa công có ích và nhiệt lượng nhận từ nguồn nóng."],"a":2,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":116,"q":"Theo quan điểm của Thomson, nguyên lý thứ hai của nhiệt động lực học phát biểu rằng:","o":["Nhiệt có thể tự truyền từ nguồn lạnh sang nguồn nóng mà không cần cung cấp công.","Mọi quá trình truyền nhiệt đều có thể diễn ra theo chiều thuận nghịch mà không làm thay đổi môi trường.","Có thể chế tạo một động cơ nhiệt biến toàn bộ nhiệt nhận từ một nguồn thành công trong một chu trình.","Không thể chế tạo động cơ nhiệt hoạt động theo chu trình chỉ trao đổi nhiệt với một nguồn duy nhất và biến toàn bộ nhiệt lượng nhận được thành công."],"a":3,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":117,"q":"Theo quan điểm của Clausius, nguyên lý thứ hai của nhiệt động lực học phát biểu rằng:","o":["Không thể có quá trình mà kết quả duy nhất là truyền nhiệt từ vật lạnh sang vật nóng mà không cần cung cấp công từ bên ngoài.","Nhiệt luôn có thể tự truyền từ vật lạnh sang vật nóng nếu hệ được thực hiện trong một chu trình kín.","Mọi máy làm lạnh đều có thể truyền nhiệt từ nguồn lạnh sang nguồn nóng mà không cần tiêu thụ công.","Nhiệt lượng có thể tự truyền theo bất kỳ chiều nào mà không phụ thuộc vào nhiệt độ của các nguồn."],"a":0,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":118,"q":"Phát biểu nào sau đây không đúng về máy làm lạnh?","o":["Máy làm lạnh sử dụng công từ bên ngoài để vận chuyển nhiệt từ nguồn lạnh đến nguồn nóng.","Tủ lạnh và máy điều hòa không khí là những ứng dụng phổ biến của nguyên lý máy làm lạnh.","Máy làm lạnh không thể hoạt động theo nguyên lý tự truyền nhiệt từ nguồn lạnh sang nguồn nóng nếu không có cung cấp công.","Máy làm lạnh có thể tự truyền nhiệt từ nguồn lạnh sang nguồn nóng mà không cần cung cấp công cho hệ."],"a":3,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":119,"q":"Đối với máy làm lạnh, phát biểu nào sau đây là đúng?","o":["Máy làm lạnh biến toàn bộ công cung cấp thành nhiệt lượng lấy ra khỏi nguồn lạnh.","Máy làm lạnh sử dụng công để chuyển nhiệt lượng từ nguồn lạnh sang môi trường có nhiệt độ cao hơn.","Máy làm lạnh chỉ hoạt động khi nguồn lạnh có nhiệt độ cao hơn môi trường bên ngoài.","Máy làm lạnh không trao đổi nhiệt với môi trường bên ngoài trong suốt quá trình hoạt động."],"a":1,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":120,"q":"Phát biểu nào sau đây đúng về nguyên lý thứ hai của nhiệt động lực học?","o":["Nguyên lý thứ hai khẳng định mọi quá trình nhiệt động đều thuận nghịch.","Nguyên lý thứ hai cho phép biến đổi toàn bộ nhiệt lượng thành công trong mọi chu trình.","Nguyên lý thứ hai chỉ áp dụng cho máy nhiệt mà không áp dụng cho các hệ thống sống.","Nguyên lý thứ hai xác định chiều diễn biến tự nhiên của các quá trình nhiệt động và đặt giới hạn đối với hiệu suất chuyển hóa nhiệt thành công."],"a":3,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":121,"q":"Chu trình Carnot gồm:","o":["Hai quá trình đẳng nhiệt thuận nghịch xen kẽ với hai quá trình đoạn nhiệt thuận nghịch.","Hai quá trình đẳng tích thuận nghịch xen kẽ với hai quá trình đẳng áp thuận nghịch.","Hai quá trình đẳng áp xen kẽ với hai quá trình đẳng tích của tác nhân nhiệt động.","Một quá trình đẳng nhiệt, một quá trình đẳng áp và hai quá trình đẳng tích thuận nghịch."],"a":0,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":122,"q":"Phát biểu nào sau đây không đúng về chu trình Carnot?","o":["Chu trình Carnot là một chu trình thuận nghịch lý tưởng.","Chu trình Carnot gồm hai quá trình đẳng nhiệt và hai quá trình đoạn nhiệt.","Hiệu suất của chu trình Carnot không phụ thuộc vào nhiệt độ tuyệt đối của nguồn nóng và nguồn lạnh.","Chu trình Carnot có hiệu suất cực đại trong số các động cơ nhiệt thuận nghịch hoạt động giữa cùng hai nguồn nhiệt."],"a":2,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":123,"q":"Phát biểu nào sau đây đúng về định lý Carnot?","o":["Mọi động cơ nhiệt đều có hiệu suất bằng hiệu suất của động cơ Carnot khi làm việc giữa cùng hai nguồn nhiệt.","Hiệu suất của động cơ Carnot phụ thuộc vào bản chất của tác nhân nhiệt động được sử dụng.","Động cơ không thuận nghịch luôn có hiệu suất cao hơn động cơ Carnot nếu giảm ma sát.","Không có động cơ nhiệt nào hoạt động giữa cùng hai nguồn nhiệt có hiệu suất lớn hơn động cơ Carnot thuận nghịch."],"a":3,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":124,"q":"Kết luận nào sau đây không được rút ra từ định lý Carnot?","o":["Hiệu suất cực đại của động cơ nhiệt phụ thuộc vào nhiệt độ của hai nguồn nhiệt.","Hiệu suất của động cơ nhiệt không phụ thuộc vào nhiệt độ của nguồn nóng và nguồn lạnh.","Động cơ thuận nghịch có hiệu suất bằng nhau khi hoạt động giữa cùng hai nguồn nhiệt.","Hiệu suất của động cơ thực tế không thể vượt quá hiệu suất Carnot với cùng hai nguồn nhiệt."],"a":1,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":125,"q":"Kết luận nào sau đây đúng được rút ra từ định lý Carnot?","o":["Hiệu suất của mọi động cơ nhiệt đều bằng 100% khi không có ma sát.","Hiệu suất động cơ Carnot phụ thuộc chủ yếu vào loại chất được sử dụng làm tác nhân.","Có thể tăng hiệu suất vô hạn bằng cách tăng lượng nhiệt nhận từ nguồn nóng.","Hiệu suất Carnot tăng khi tăng nhiệt độ tuyệt đối của nguồn nóng hoặc giảm nhiệt độ tuyệt đối của nguồn lạnh, trong giới hạn vật lý cho phép."],"a":3,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":126,"q":"Phát biểu nào sau đây đúng về entropy?","o":["Entropy là một hàm trạng thái đặc trưng cho mức độ phân tán năng lượng và được sử dụng để mô tả tính không thuận nghịch của quá trình.","Entropy là đại lượng chỉ có giá trị đối với chất khí và không được áp dụng cho chất lỏng hoặc hệ sinh học.","Entropy luôn bằng không đối với mọi hệ đang ở trạng thái cân bằng nhiệt động.","Entropy là đại lượng biểu thị trực tiếp lượng nhiệt mà hệ nhận được trong một quá trình bất kỳ."],"a":0,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":127,"q":"Phát biểu nào sau đây không đúng về nguyên lý tăng entropy?","o":["Đối với một hệ cô lập, entropy không giảm trong quá trình tự phát.","Trong quá trình thuận nghịch, entropy của một hệ cô lập không thay đổi.","Entropy của một hệ cô lập luôn giảm theo thời gian vì năng lượng ngày càng được tập trung hơn.","Nguyên lý tăng entropy giúp xác định chiều diễn biến tự nhiên của nhiều quá trình nhiệt động."],"a":2,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":128,"q":"Phát biểu nào sau đây đúng về nguyên lý tăng entropy?","o":["Entropy của mọi hệ luôn giảm khi hệ nhận nhiệt từ môi trường.","Entropy của hệ cô lập luôn bằng không bất kể quá trình diễn ra như thế nào. C. Entropy chỉ tăng trong các hệ vật lý và không liên quan đến các hệ sinh học.","Trong một hệ cô lập, entropy không giảm; đối với quá trình không thuận nghịch, entropy của hệ cô lập tăng."],"a":2,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":129,"q":"Phát biểu nào sau đây không đúng khi nói về trạng thái dừng của một hệ thống sống?","o":["Hệ thống sống có thể duy trì các thông số vĩ mô tương đối ổn định trong một khoảng thời gian.","Trạng thái dừng của hệ sống được duy trì nhờ sự trao đổi liên tục vật chất và năng lượng với môi trường.","Trạng thái dừng của cơ thể không đồng nghĩa với trạng thái cân bằng nhiệt động hoàn toàn.","Khi đạt trạng thái dừng, cơ thể không còn trao đổi vật chất và năng lượng với môi trường bên ngoài."],"a":3,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":130,"q":"Phát biểu nào sau đây không đúng về trạng thái dừng của một hệ thống sống?","o":["Trạng thái dừng có thể được duy trì nhờ các quá trình chuyển hóa vật chất và năng lượng liên tục.","Các thông số sinh lý của cơ thể có thể dao động quanh những giá trị tương đối ổn định trong trạng thái dừng.","Trạng thái dừng của cơ thể là trạng thái cân bằng nhiệt động, trong đó không có dòng năng lượng và vật chất qua hệ.","Cơ thể cần liên tục trao đổi năng lượng và vật chất với môi trường để duy trì trạng thái dừng."],"a":2,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":131,"q":"Phát biểu nào sau đây không đúng khi nói về trạng thái dừng của một hệ thống sống?","o":["Hệ thống sống là một hệ mở, thường xuyên trao đổi vật chất và năng lượng với môi trường.","Trạng thái dừng có thể được duy trì nhờ sự cân bằng tương đối giữa các quá trình tạo ra và tiêu thụ vật chất, năng lượng.","Sự ổn định của trạng thái dừng không có nghĩa là mọi quá trình vi mô trong cơ thể đều ngừng biến đổi.","Khi cơ thể đạt trạng thái dừng, quá trình chuyển hóa năng lượng trong cơ thể sẽ dừng lại vì các thông số sinh lý đã ổn định."],"a":3,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":132,"q":"Một động cơ nhiệt hoạt động theo chu trình Carnot. Trong một chu kỳ, động cơ sinh công 3 𝑘𝐽và thải cho nguồn lạnh nhiệt lượng 3,5 𝑘𝑐𝑎𝑙. Lấy 1 𝑘𝑐𝑎𝑙= 4,186 𝑘𝐽. Hiệu suất của động cơ gần bằng:","o":["12,0%","15,6%","17,0%","20,4%."],"a":2,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":133,"q":"Một động cơ nhiệt hoạt động theo chu trình Carnot. Trong một chu kỳ, động cơ sinh công 3,99 𝑘𝐽và thải cho nguồn lạnh 5 𝑘𝑐𝑎𝑙. Lấy 1 𝑘𝑐𝑎𝑙= 4,186 𝑘𝐽. Hiệu suất của động cơ gần bằng:","o":["12,3%","16,0%","19,5%","23,4%"],"a":1,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":134,"q":"Một tủ lạnh tiêu thụ công 359 𝐽để lấy nhiệt lượng 953 𝐽từ buồng lạnh. Hệ số làm lạnh của tủ lạnh là:","o":["0,38","1,38","2,66","3,66"],"a":2,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":135,"q":"Một tủ lạnh tiêu thụ công 369 𝐽để lấy nhiệt lượng 963 𝐽từ buồng lạnh. Nhiệt lượng tủ lạnh thải ra môi trường bên ngoài là:","o":["594 𝐽","963 𝐽","1332 𝐽","1451 𝐽"],"a":2,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":136,"q":"Một tủ lạnh sử dụng công 569 𝐽để lấy nhiệt lượng 965 𝐽từ buồng lạnh. Hệ số làm lạnh và nhiệt lượng tủ lạnh thải ra môi trường lần lượt là:","o":["𝐾= 0,59; 𝑄𝐻= 396 𝐽","𝐾≈1,70; 𝑄𝐻= 1534 𝐽","𝐾≈2,70; 𝑄𝐻= 1534 𝐽","𝐾≈1,70; 𝑄𝐻= 965 𝐽"],"a":1,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":137,"q":"Đại lượng nào là thước đo mức độ chuyển động nhiệt của các phần tử cấu tạo nên một hệ?","o":["Nội năng của hệ.","Entropy của hệ.","Nhiệt độ của hệ.","Nhiệt lượng mà hệ trao đổi với môi trường."],"a":2,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":138,"q":"Phát biểu nào sau đây đúng về thang nhiệt độ và thiết bị đo nhiệt độ?","o":["Nhiệt độ có thể được biểu diễn theo nhiều thang đo như Celsius, Kelvin hoặc Fahrenheit; nhiệt kế được sử dụng để xác định nhiệt độ của hệ.","Thang Kelvin có thể nhận các giá trị âm trong điều kiện nhiệt động lực học thông thường.","Nhiệt độ Celsius và nhiệt độ Kelvin có cùng giá trị số ở mọi trạng thái nhiệt động.","Mọi thiết bị đo nhiệt độ đều hoạt động dựa trên sự thay đổi thể tích của chất lỏng khi nhiệt độ thay đổi."],"a":0,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":139,"q":"Động cơ nhiệt, tức thiết bị biến đổi một phần nhiệt năng thành công cơ học, hoạt động dựa trên nguyên tắc:","o":["Chuyển toàn bộ nhiệt lượng nhận được từ nguồn nóng thành công mà không cần thải nhiệt.","Truyền nhiệt tự phát từ nguồn lạnh sang nguồn nóng mà không cần cung cấp công.","Chuyển toàn bộ nội năng của tác nhân thành công trong một chu trình kín.","Nhận nhiệt từ nguồn nóng, chuyển một phần thành công và thải phần nhiệt còn lại cho nguồn lạnh."],"a":3,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":140,"q":"Máy làm lạnh hoạt động dựa trên nguyên tắc:","o":["Tự truyền nhiệt từ nguồn lạnh sang nguồn nóng mà không cần cung cấp năng lượng từ bên ngoài.","Sử dụng công từ bên ngoài để chuyển nhiệt lượng từ nguồn lạnh sang nguồn nóng.","Chuyển toàn bộ nhiệt lượng lấy từ nguồn lạnh thành công cơ học có ích.","Làm giảm nhiệt độ nguồn lạnh bằng cách ngừng hoàn toàn quá trình trao đổi năng lượng với môi trường. CHƯƠNG 5. ĐIỆN HỌC"],"a":1,"ch":"CHƯƠNG 4. NHIỆT HỌC"},{"n":141,"q":"Các loại điện thế sinh học cơ bản trong cơ thể sống là:","o":["Điện thế nghỉ và điện xoay chiều.","Điện thế nghỉ và điện thế hoạt động.","Điện thế cao tần và điện thế hoạt động.","Điện thế hoạt động và điện thế trung tần."],"a":1,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":142,"q":"Phát biểu nào sau đây đúng khi nói về điện thế nghỉ của màng tế bào?","o":["Điện thế màng không ổn định và có giá trị dương.","Điện thế không ổn định, chỉ mật độ điện tích dương là không đổi.","Điện thế ổn định, chỉ mật độ điện tích âm là biến đổi.","Điện thế màng ở trạng thái nghỉ tương đối ổn định và có giá trị âm ở mặt trong so với mặt ngoài màng."],"a":3,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":143,"q":"Điện thế màng tế bào ở trạng thái nghỉ thường có giá trị trong khoảng:","o":["Từ −50 mV đến −94 mV.","Từ 50 mV đến 94 V.","Từ −50 mV đến 94 mV.","Từ −94 mV đến 50 V."],"a":0,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":144,"q":"Điện thế màng tế bào được xác định bằng:","o":["Điện thế mặt ngoài màng cộng điện thế mặt trong màng.","Điện thế mặt ngoài màng trừ điện thế mặt trong màng.","Điện thế mặt trong màng trừ điện thế mặt ngoài màng.","Điện thế mặt ngoài màng chia cho điện thế mặt trong màng."],"a":2,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":145,"q":"Điện thế hoạt động là:","o":["Hiệu điện thế tồn tại trong khoảng thời gian rất dài.","Hiệu điện thế tồn tại trong khoảng thời gian rất ngắn hoặc rất dài.","Xung điện thế tồn tại trong khoảng thời gian đủ dài.","Một biến đổi điện thế có tính chất xung, tồn tại trong khoảng thời gian rất ngắn."],"a":3,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":146,"q":"Theo cách phân chia được sử dụng trong tài liệu, một điện thế hoạt động được chia thành:","o":["03 giai đoạn.","04 giai đoạn.","05 giai đoạn.","06 giai đoạn."],"a":2,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":147,"q":"Các giai đoạn của một điện thế hoạt động diễn ra theo trình tự nào sau đây?","o":["Mất phân cực → đảo cực → tái phân cực → quá phân cực.","Đảo cực → mất phân cực → tái phân cực → quá phân cực.","Quá phân cực → đảo cực → mất phân cực → tái phân cực.","Mất phân cực → tái phân cực → đảo cực → quá phân cực."],"a":0,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":148,"q":"Thời gian kéo dài của một xung điện thế nhọn trong điện thế hoạt động thường nằm trong khoảng:","o":["0,5–5 ms.","0,1–3 ms.","0,5–3 ms.","0,3–5 ms."],"a":2,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":149,"q":"Dòng điện sinh học ghi được trên cơ thể người không bao gồm:","o":["Dòng điện Fuco.","Dòng điện sinh học của não.","Điện cơ.","Dòng điện sinh học của tim."],"a":0,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":150,"q":"Theo nội dung tài liệu, để tạo ra dòng tuần hoàn máu và thể dịch liên tục trong cơ thể, tim có một tập hợp gồm:","o":["02 tổ chức.","04 tổ chức.","05 tổ chức.","03 tổ chức."],"a":1,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":151,"q":"Phát biểu nào sau đây đúng về các thành phần tạo nên dòng điện sinh học của tim?","o":["Chỉ hệ thống cơ tim và hệ thần kinh tự động tham gia tạo nên dòng điện sinh học của tim.","Các thành phần gồm hệ thống cơ tim, hệ thần kinh tự động và hệ thống van tim cùng các cấu trúc liên quan.","Dòng điện sinh học của tim chỉ được tạo ra bởi hệ thống van tim.","Hệ thần kinh tự động không có vai trò trong hoạt động điện của tim."],"a":1,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":152,"q":"Hệ thống cơ tim tham gia tạo nên hoạt động điện của tim có đặc điểm:","o":["Gồm các tế bào thần kinh tự động phát xung động dẫn truyền đến cơ tim.","Chỉ có chức năng duy trì dòng máu mà không tham gia hoạt động điện của tim.","Được cấu tạo bởi các tế bào có khả năng co bóp nhịp nhàng, góp phần duy trì tuần hoàn máu.","Có khả năng co bóp nhịp nhàng dưới sự điều hòa của hệ thống phát và dẫn truyền xung động điện của tim."],"a":3,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":153,"q":"Theo nội dung tài liệu, hệ thống phát và dẫn truyền xung động của tim có vai trò:","o":["Phát sinh và dẫn truyền các xung động điện, góp phần điều hòa sự co bóp nhịp nhàng của cơ tim.","Chỉ kiểm soát hoạt động của các van tim mà không liên quan đến cơ tim.","Chỉ đảm nhiệm chức năng đưa máu từ tâm thất đến các cơ quan.","Không tham gia vào quá trình điều hòa nhịp tim."],"a":0,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":154,"q":"Phát biểu nào sau đây không đúng về vai trò của hệ thống van tim?","o":["Van tim đóng mở theo chu kỳ hoạt động của tim.","Van tim góp phần duy trì dòng máu theo một chiều qua các buồng tim.","Van tim giúp hạn chế dòng máu chảy ngược giữa các buồng tim và mạch máu.","Van tim đóng mở không theo quy luật và làm cho máu lưu chuyển theo cả hai chiều giữa các buồng tim."],"a":3,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":155,"q":"Phát biểu nào sau đây không đúng về dòng điện sinh học của tim và điện tâm đồ?","o":["Điện tâm đồ là đồ thị biểu diễn những biến đổi điện thế của tim theo thời gian.","Dòng điện tim là dòng điện một chiều có cường độ ổn định.","Hoạt động điện của tim có thể được ghi nhận bằng điện tâm đồ.","Điện tâm đồ là một phương pháp cận lâm sàng phổ biến trong đánh giá hoạt động điện của tim."],"a":1,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":156,"q":"Cơ chế hoạt động điện sinh học của não có thể được mô tả phù hợp nhất là:","o":["Não chỉ tiếp nhận thông tin mà không tham gia phân tích và xử lý thông tin.","Não chỉ tạo ra các xung điện để điều khiển hoạt động vận động.","Não chỉ thực hiện các hoạt động có ý thức.","Não tiếp nhận, xử lý và tổng hợp thông tin, đồng thời phát các tín hiệu điều khiển đến các cơ quan và hệ thống đáp ứng."],"a":3,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":157,"q":"Phát biểu nào sau đây không đúng về dòng điện sinh học của não?","o":["Dòng điện sinh học của não chỉ có chức năng điều khiển các hoạt động sống có ý thức của toàn cơ thể.","Sóng điện não phản ánh hoạt động điện của một quần thể lớn các tế bào thần kinh.","Hoạt động điện của não liên quan đến cả các hoạt động có ý thức và không có ý thức của cơ thể.","Sóng điện não có thể được ghi nhận thông qua các điện cực đặt trên da đầu."],"a":0,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":158,"q":"Phát biểu nào sau đây không đúng về sóng điện não và phương pháp điện não đồ?","o":["Điện não đồ ghi nhận hoạt động điện của não thông qua các điện cực đặt trên da đầu.","Sóng điện não có thể truyền qua các mô nằm giữa não và điện cực ngoài da đầu.","Điện cực của điện não đồ không thể tiếp xúc với da đầu thông qua gel hoặc chất dẫn điện.","Điện não đồ biểu diễn các biến đổi của hoạt động điện não theo thời gian."],"a":2,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":159,"q":"Khi cho dòng điện một chiều đi qua các tổ chức trong cơ thể chứa chủ yếu nước và chất điện giải, hiện tượng nào sau đây xảy ra?","o":["Ion âm dịch chuyển về cực âm và ion dương dịch chuyển về cực dương.","Cả ion âm và ion dương đều dịch chuyển về cực dương.","Dòng điện một chiều không gây ra hiện tượng điện ly trong tổ chức.","Xảy ra hiện tượng điện ly; ion âm chuyển về cực dương và ion dương chuyển về cực âm."],"a":3,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":160,"q":"Một trong những ứng dụng của dòng điện một chiều trong y tế là ion liệu pháp. Phương pháp này nhằm:","o":["Đưa các ion thuốc thích hợp vào cơ thể thông qua tác dụng của dòng điện một chiều.","Chỉ đưa các thuốc có phân tử lớn vào cơ thể bằng dòng điện.","Chỉ lấy các ion thuốc ra khỏi cơ thể mà không đưa thuốc vào cơ thể.","Sử dụng dòng điện xoay chiều để đưa các ion thuốc vào cơ thể."],"a":0,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":161,"q":"Một trong những tác dụng sinh lý của dòng điện một chiều trong điều trị là:","o":["Chỉ gây giãn mạch mà không ảnh hưởng đến cảm giác đau.","Chỉ làm tăng dinh dưỡng mô mà không ảnh hưởng đến tuần hoàn.","Có thể gây giãn mạch, giảm đau và tăng cường tuần hoàn, dinh dưỡng tại vùng được điều trị.","Chỉ gây co mạch và làm giảm tuần hoàn tại vùng điều trị."],"a":2,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":162,"q":"Trong điều trị y tế, dòng điện xoay chiều có thể được phân loại theo tần số thành:","o":["Dòng một chiều, dòng hạ tần và dòng trung tần.","Dòng hạ tần và dòng trung tần.","Dòng trung tần và dòng cao tần.","Dòng hạ tần, dòng trung tần và dòng cao tần."],"a":3,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":163,"q":"Tác dụng chủ yếu của dòng điện hạ tần trong điều trị là:","o":["Tạo hiệu ứng nhiệt để cắt và đốt tổ chức.","Kích thích cơ, hỗ trợ chống teo cơ; sự co cơ có thể góp phần tăng cường tuần hoàn và dinh dưỡng mô.","Chủ yếu được sử dụng để đưa ion thuốc vào cơ thể.","Chủ yếu tạo ra hiệu ứng nhiệt sâu trong mô."],"a":1,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":164,"q":"Phát biểu nào sau đây không đúng về tác dụng của dòng điện trung tần trong điều trị?","o":["Dòng trung tần có thể được sử dụng trong một số phương pháp kích thích điện.","Với các thông số thích hợp, dòng trung tần có thể tạo kích thích cơ.","Dòng trung tần có thể được sử dụng trong một số ứng dụng vật lý trị liệu.","Dòng trung tần luôn gây co cơ mạnh hơn dòng hạ tần ở cùng mọi mức cường độ và tần số."],"a":3,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":165,"q":"Tác dụng của dòng điện cao tần trong điều trị chủ yếu liên quan đến:","o":["Kích thích trực tiếp các dây thần kinh vận động.","Đưa ion thuốc qua da bằng điện di.","Gây co cơ nhịp nhàng để chống teo cơ.","Tạo hiệu ứng nhiệt, có thể được ứng dụng trong một số kỹ thuật điều trị và can thiệp y khoa."],"a":3,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":166,"q":"Khi bác sĩ đặt các điện cực lên ngực và các chi của bệnh nhân để ghi điện tâm đồ (ECG), thiết bị chủ yếu ghi nhận:","o":["Sự thay đổi của lưu lượng máu qua các buồng tim trong từng chu kỳ hoạt động của tim.","Sự biến đổi của áp suất trong các buồng tim và các mạch máu lớn theo thời gian.","Sự biến đổi hoạt động điện của tim và những thay đổi của tín hiệu điện theo thời gian.","Sự thay đổi nhiệt độ của cơ tim trong quá trình co bóp và giãn nghỉ của tim."],"a":2,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":167,"q":"Một bệnh nhân được chỉ định ghi điện não đồ (EEG) để đánh giá hoạt động điện của não. Các điện cực được đặt chủ yếu trên da đầu vì:","o":["Da đầu là vị trí tập trung phần lớn các tín hiệu điện được tạo ra trong hoạt động của não.","Các điện cực cần tiếp xúc trực tiếp với mô não để có thể ghi nhận chính xác các tín hiệu điện.","Xương sọ có khả năng khuếch đại các tín hiệu điện của não trước khi truyền đến các điện cực.","Hoạt động điện của não có thể truyền qua các mô nằm giữa não và được ghi nhận bằng điện cực đặt trên da đầu."],"a":3,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":168,"q":"Một bệnh nhân bị teo cơ do tổn thương thần kinh vận động được chỉ định kích thích điện trong vật lý trị liệu. Mục đích chính của việc sử dụng dòng điện hạ tần trong trường hợp này là:","o":["Tạo ra tác dụng nhiệt tại vùng cơ được điều trị nhằm làm tăng chuyển hóa và giảm lượng mô mỡ.","Kích thích cơ tạo ra các đáp ứng co cơ, qua đó hỗ trợ hạn chế teo cơ và tăng cường tuần hoàn tại vùng điều trị.","Tạo điều kiện đưa trực tiếp các hoạt chất điều trị từ bên ngoài vào hệ tuần hoàn thông qua tác dụng của dòng điện.","Làm giảm hoạt động điện tự nhiên của cơ để hạn chế sự co cơ không mong muốn trong quá trình điều trị."],"a":1,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":169,"q":"Trong một phương pháp ion liệu pháp, thuốc có dạng ion được đưa vào cơ thể dưới tác dụng của dòng điện một chiều. Cơ sở vật lý của phương pháp này là:","o":["Các ion chịu tác dụng của điện trường và dịch chuyển theo hướng phù hợp với dấu điện tích của chúng trong môi trường.","Các ion thuốc tự khuếch tán qua da vào cơ thể mà không chịu ảnh hưởng đáng kể của điện trường được tạo ra bởi dòng điện.","Dòng điện một chiều làm biến đổi thuốc thành dạng bức xạ điện từ có khả năng xuyên qua da và đi vào các tổ chức.","Dòng điện một chiều làm tăng nhiệt độ tại vùng điều trị, từ đó làm tăng tốc độ khuếch tán của thuốc vào các mô bên dưới."],"a":0,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":170,"q":"Một bệnh nhân được điều trị bằng dòng điện một chiều tại một vùng cơ thể nhằm hỗ trợ giảm đau và tăng cường tuần hoàn. Hiện tượng sinh lý nào phù hợp nhất với mục đích điều trị này?","o":["Gây co mạch tại vùng điều trị trong thời gian thích hợp nhằm hạn chế dòng máu và giảm hoạt động chuyển hóa của mô.","Làm giảm đáng kể hoạt động của các tế bào thần kinh tại vùng điều trị nhằm hạn chế sự truyền dẫn các tín hiệu thần kinh.","Làm giảm hoạt động trao đổi chất của các tổ chức tại vùng có dòng điện đi qua nhằm hạn chế nhu cầu sử dụng oxy của mô.","Gây giãn mạch và góp phần tăng cường tuần hoàn, cung cấp chất dinh dưỡng cho các tổ chức tại vùng điều trị."],"a":3,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":171,"q":"Một vận động viên bị đau cơ sau khi vận động quá mức được chỉ định một phương pháp vật lý trị liệu sử dụng dòng điện. Khi dòng điện được lựa chọn phù hợp, tác dụng mong muốn có thể là:","o":["Làm giảm đáng kể khả năng co cơ tại vùng điều trị nhằm hạn chế hoàn toàn hoạt động của các cơ đang bị đau.","Tạo ra tổn thương có kiểm soát tại mô cơ nhằm kích thích quá trình sửa chữa và phục hồi của tổ chức bị tổn thương.","Kích thích hoạt động của cơ và hỗ trợ tăng cường tuần hoàn, qua đó góp phần cải thiện điều kiện phục hồi tại vùng điều trị.","Làm ngừng hoàn toàn hoạt động điện sinh học của cơ trong thời gian điều trị nhằm tránh xuất hiện các xung động bất thường."],"a":2,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":172,"q":"Khi theo dõi một bệnh nhân có biểu hiện rối loạn nhịp tim, bác sĩ chỉ định điện tâm đồ. Lý do quan trọng nhất là:","o":["Điện tâm đồ có thể xác định trực tiếp lượng máu mà tim bơm vào hệ tuần hoàn trong mỗi chu kỳ hoạt động của tim.","Điện tâm đồ cung cấp thông tin về hoạt động điện của tim và sự biến đổi của hoạt động điện đó theo thời gian.","Điện tâm đồ có thể xác định trực tiếp nồng độ oxy trong máu và mức độ cung cấp oxy cho các tổ chức trong cơ thể.","Điện tâm đồ có thể đo trực tiếp áp suất của máu trong động mạch và xác định sự thay đổi huyết áp theo từng chu kỳ tim."],"a":1,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":173,"q":"Một bệnh nhân có biểu hiện co giật được chỉ định điện não đồ. Trong trường hợp này, EEG có giá trị chủ yếu trong việc:","o":["Đánh giá trực tiếp lượng máu được cung cấp cho não thông qua sự thay đổi của các tín hiệu ghi nhận trên da đầu.","Xác định trực tiếp cấu trúc giải phẫu của não và vị trí của các vùng chức năng dựa trên hoạt động điện được ghi nhận.","Đánh giá áp suất của dịch não tủy thông qua sự thay đổi của tín hiệu điện ghi nhận từ các điện cực trên da đầu.","Ghi nhận và đánh giá những biến đổi trong hoạt động điện của não thông qua các tín hiệu thu được từ điện cực đặt trên da đầu."],"a":3,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":174,"q":"Trong điều trị bằng dòng điện cao tần, năng lượng điện được sử dụng chủ yếu để tạo ra:","o":["Hiện tượng điện ly trong các tổ chức nhằm hỗ trợ đưa các ion thuốc từ môi trường bên ngoài vào cơ thể qua da.","Kích thích trực tiếp các tế bào thần kinh vận động nhằm tạo ra sự co cơ có kiểm soát tại vùng điều trị.","Hiệu ứng nhiệt trong mô, có thể được khai thác trong một số kỹ thuật điều trị và can thiệp y khoa phù hợp.","Sự thay đổi ổn định của điện thế màng tế bào nhằm duy trì trạng thái phân cực trong suốt thời gian điều trị."],"a":2,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":175,"q":"Một thiết bị kích thích điện trong vật lý trị liệu được sử dụng không đúng cường độ có thể gây cảm giác khó chịu hoặc đau cho bệnh nhân. Điều này cho thấy khi ứng dụng dòng điện trong điều trị cần:","o":["Chỉ cần xác định đúng loại dòng điện sử dụng mà không cần quan tâm đến cường độ, thời gian và các thông số điều trị khác.","Sử dụng cường độ dòng điện càng lớn càng tốt để tạo ra kích thích mạnh và tăng hiệu quả điều trị trong thời gian ngắn.","Không cần xem xét tình trạng sức khỏe và đáp ứng của từng bệnh nhân nếu thiết bị điều trị đã được thiết lập các thông số ban đầu.","Lựa chọn và kiểm soát phù hợp các thông số dòng điện dựa trên mục đích điều trị, tình trạng và đáp ứng của từng bệnh nhân. CHƯƠNG 6. QUANG SINH HỌC"],"a":3,"ch":"CHƯƠNG 5. ĐIỆN HỌC"},{"n":176,"q":"Theo định luật Bouguer–Lambert–Beer, khi ánh sáng truyền qua một dung dịch hấp thụ, cường độ ánh sáng truyền qua thay đổi như thế nào?","o":["Cường độ ánh sáng truyền qua tăng khi nồng độ chất hấp thụ tăng.","Cường độ ánh sáng truyền qua giảm khi nồng độ chất hấp thụ tăng.","Cường độ ánh sáng truyền qua không phụ thuộc vào nồng độ chất hấp thụ.","Cường độ ánh sáng truyền qua chỉ phụ thuộc vào chiều dài cuvet."],"a":1,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":177,"q":"Trong một dung dịch loãng, khả năng hấp thụ ánh sáng của một phân tử chất tan được xem là:","o":["Phụ thuộc mạnh vào sự có mặt của các phân tử chất tan khác trong dung dịch.","Không phụ thuộc đáng kể vào sự có mặt của các phân tử khác xung quanh nó.","Chỉ phụ thuộc vào nồng độ của dung dịch.","Không phụ thuộc vào bước sóng của ánh sáng chiếu vào."],"a":1,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":178,"q":"Hệ số hấp thụ mol của một chất phụ thuộc chủ yếu vào:","o":["Bản chất chất hấp thụ và bước sóng của bức xạ chiếu vào.","Nồng độ dung dịch và thể tích dung dịch.","Chiều dài cuvet và thể tích dung dịch.","Khối lượng dung dịch và nhiệt độ phòng."],"a":0,"ch":"CHƯƠNG 6. QUANG SINH HỌC"},{"n":179,"q":"Điều kiện nào sau đây phù hợp để áp dụng định luật Bouguer–Lambert–Beer?","o":["Dung
